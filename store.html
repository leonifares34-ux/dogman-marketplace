<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Man Marketplace - Store</title>
  
  <!-- Pusher JS Library -->
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
    }

    body {
      background-color: #f4f8fb;
      color: #111;
      padding-bottom: 60px;
    }

    /* Autoplay Prompt Banner */
    #audioBanner {
      background-color: #ff3b30;
      color: #ffffff;
      text-align: center;
      padding: 12px 16px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: background-color 0.2s ease;
    }

    #audioBanner.unlocked {
      background-color: #34c759;
    }

    /* Header & Navigation */
    header {
      background-color: #ffcc00;
      color: #000;
      padding: 20px 16px 16px 16px;
      text-align: center;
      border-bottom: 4px solid #000;
      box-shadow: 0 4px 0px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 2.4rem;
      margin-bottom: 4px;
      text-shadow: 2px 2px 0px #fff;
    }

    nav.nav-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }

    .nav-link {
      background-color: #ffffff;
      color: #000;
      border: 2px solid #000;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 2px 2px 0px #000;
      transition: all 0.1s ease;
    }

    .nav-link.active {
      background-color: #007aff;
      color: #ffffff;
    }

    .nav-link:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #000;
    }

    main {
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border: 3px solid #000;
      padding: 14px 20px;
      border-radius: 12px;
      box-shadow: 4px 4px 0px #000;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #ff9500;
      border: 2px solid #000;
    }

    .dot.connected {
      background-color: #34c759;
    }

    .section-box {
      background: white;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 4px 4px 0px #000;
    }

    .section-box h2 {
      font-size: 1.6rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 12px;
    }

    .card {
      background: #fff;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 3px 3px 0px #000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border: 2px solid #000;
      border-radius: 8px;
      margin-bottom: 12px;
      background-color: #eee;
    }

    .card h3 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .card .price {
      font-weight: bold;
      color: #007aff;
      font-size: 1.2rem;
      margin-bottom: 12px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    /* Form & Controls */
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-weight: bold;
    }

    .form-group input, .form-group select, .form-group textarea {
      padding: 10px;
      border: 2px solid #000;
      border-radius: 8px;
      font-size: 1rem;
      background: #fafafa;
    }

    .checkbox-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f0f6ff;
      border: 2px solid #000;
      padding: 14px;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* Buttons */
    .btn {
      background-color: #ffcc00;
      color: #000;
      border: 2px solid #000;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
      transition: all 0.1s ease;
      text-align: center;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #000;
    }

    .btn-blue {
      background-color: #007aff;
      color: white;
    }

    .btn-danger {
      background-color: #ff3b30;
      color: white;
    }

    .btn-full {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .two-col {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Autoplay Lock Banner -->
  <div id="audioBanner">
    🔊 Sound Disabled: Click anywhere on this page to enable sound!
  </div>

  <header>
    <h1>🐶 Dog Man Marketplace</h1>
    <nav class="nav-bar">
      <a href="index.html" class="nav-link">🏠 Home (index.html)</a>
      <a href="store.html" class="nav-link active">🛒 Store</a>
    </nav>
  </header>

  <main>
    <!-- Realtime Connection Bar -->
    <div class="status-bar">
      <div class="status-indicator">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Connecting to Realtime Channel...</span>
      </div>
      <button id="manualTriggerBtn" class="btn btn-blue">🔊 Test / Broadcast Sound</button>
    </div>

    <!-- Store Catalog -->
    <div class="section-box">
      <h2>🛒 Marketplace Products</h2>
      <div id="productsGrid" class="products-grid">
        <!-- Dynamic Cards Rendered via JS -->
      </div>
    </div>

    <div class="two-col">
      <!-- Seller Admin Section -->
      <div class="section-box">
        <h2>🛠️ Seller Panel (Add Product)</h2>
        <form id="addProductForm">
          <div class="form-group">
            <label for="prodTitle">Product Name:</label>
            <input type="text" id="prodTitle" required placeholder="e.g. Supa Buddies Comic">
          </div>

          <div class="form-group">
            <label for="prodPrice">Price ($ or points):</label>
            <input type="text" id="prodPrice" required placeholder="e.g. $5.00">
          </div>

          <div class="form-group">
            <label for="prodImgUrl">Image Source (URL or File):</label>
            <input type="url" id="prodImgUrl" placeholder="https://example.com/image.jpg">
            <span style="text-align: center; font-weight: bold; margin: 4px 0;">- OR -</span>
            <input type="file" id="prodImgFile" accept="image/*">
          </div>

          <button type="submit" class="btn btn-full">➕ Add Item to Store</button>
        </form>
      </div>

      <!-- Checkout / Order Form Section -->
      <div class="section-box">
        <h2>📦 Place Order (Formspree)</h2>
        <form id="orderForm" action="https://formspree.io/f/maewbvzr" method="POST">
          
          <!-- Customer Selection Dropdown -->
          <div class="form-group">
            <label for="customerName">Select Customer:</label>
            <select id="customerName" name="customerName" required>
              <option value="" disabled selected>-- Choose Name --</option>
              <option value="Arthur">Arthur</option>
              <option value="Denise">Denise</option>
              <option value="Josh">Josh</option>
              <option value="Luna">Luna</option>
              <option value="Other">Other Customer</option>
            </select>
          </div>

          <!-- Multi-item Checkbox Menu -->
          <div class="form-group">
            <label>Selected Items:</label>
            <div id="checkboxContainer" class="checkbox-container">
              <!-- Dynamically Populated Checkboxes -->
            </div>
            <input type="hidden" id="finalOrderItems" name="ordered_items">
          </div>

          <div class="form-group">
            <label for="email">Contact Email:</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com">
          </div>

          <div class="form-group">
            <label for="address">Delivery Address / Notes:</label>
            <textarea id="address" name="delivery_address" rows="3" required placeholder="Enter delivery location or notes..."></textarea>
          </div>

          <button type="submit" class="btn btn-full btn-blue">🚀 Send Order</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Audio Element -->
  <audio id="syncAudio" src="sound.mp3" preload="auto"></audio>

  <script>
    // --- 1. Configurations ---
    const PUSHER_KEY = '3651c3c833375dea577d';
    const PUSHER_CLUSTER = 'eu';
    const CHANNEL_NAME = 'dogman-store';
    const EVENT_NAME = 'play-sound';

    // Default Catalog Items
    const defaultProducts = [
      { id: '1', title: 'Dog Man Book Vol. 1', price: '$9.99', image: 'https://m.media-amazon.com/images/I/81q6xP8a3FL.jpg' },
      { id: '2', title: 'Petey Plushie', price: '$14.99', image: 'https://m.media-amazon.com/images/I/71yR3A-E-LL.jpg' },
      { id: '3', title: 'Bark Knight Badge', price: '$4.99', image: 'https://m.media-amazon.com/images/I/61+R+xI2uBL.jpg' }
    ];

    // Local Storage Data Persistence
    let products = JSON.parse(localStorage.getItem('dogman_products')) || defaultProducts;

    // DOM References
    const syncAudio = document.getElementById('syncAudio');
    const audioBanner = document.getElementById('audioBanner');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const productsGrid = document.getElementById('productsGrid');
    const checkboxContainer = document.getElementById('checkboxContainer');
    const addProductForm = document.getElementById('addProductForm');
    const orderForm = document.getElementById('orderForm');
    const finalOrderInput = document.getElementById('finalOrderItems');

    let isAudioUnlocked = false;

    // --- 2. Autoplay Audio Unlocking ---
    function unlockAudio() {
      if (isAudioUnlocked) return;

      syncAudio.play().then(() => {
        syncAudio.pause();
        syncAudio.currentTime = 0;
        isAudioUnlocked = true;

        audioBanner.textContent = "✅ Sound Sync Active!";
        audioBanner.classList.add('unlocked');
        setTimeout(() => {
          audioBanner.style.display = 'none';
        }, 1500);
      }).catch(err => {
        console.warn("Audio unlock waiting for user gesture...", err);
      });
    }

    document.addEventListener('click', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);

    // --- 3. Pusher Realtime Connection ---
    const pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
    const channel = pusher.subscribe(CHANNEL_NAME);

    pusher.connection.bind('connected', () => {
      statusDot.classList.add('connected');
      statusText.textContent = "Realtime Sound Sync Active";
    });

    pusher.connection.bind('disconnected', () => {
      statusDot.classList.remove('connected');
      statusText.textContent = "Disconnected";
    });

    channel.bind(EVENT_NAME, function() {
      if (!isAudioUnlocked) return;
      syncAudio.currentTime = 0;
      syncAudio.play().catch(e => console.error("Sound play error:", e));
    });

    document.getElementById('manualTriggerBtn').addEventListener('click', () => {
      unlockAudio();
      syncAudio.currentTime = 0;
      syncAudio.play();
    });

    // --- 4. Render Storefront & Checkboxes ---
    function renderStore() {
      localStorage.setItem('dogman_products', JSON.stringify(products));
      
      productsGrid.innerHTML = '';
      checkboxContainer.innerHTML = '';

      if (products.length === 0) {
        productsGrid.innerHTML = '<p>No items in store. Add one using the seller panel!</p>';
        checkboxContainer.innerHTML = '<em>No items available</em>';
        return;
      }

      products.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/200?text=Dog+Man'}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
          <h3>${item.title}</h3>
          <div class="price">${item.price}</div>
          <div class="card-actions">
            <button class="btn btn-full" onclick="selectItem('${item.id}')">Select for Order</button>
            <button class="btn btn-danger" onclick="deleteItem('${item.id}')">🗑️</button>
          </div>
        `;
        productsGrid.appendChild(card);

        const checkLabel = document.createElement('label');
        checkLabel.className = 'checkbox-item';
        checkLabel.innerHTML = `
          <input type="checkbox" class="order-chk" value="${item.title} (${item.price})" id="chk-${item.id}">
          ${item.title} - ${item.price}
        `;
        checkboxContainer.appendChild(checkLabel);
      });
    }

    // --- 5. Add / Delete Item Handlers ---
    addProductForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const title = document.getElementById('prodTitle').value;
      const price = document.getElementById('prodPrice').value;
      const imgUrl = document.getElementById('prodImgUrl').value;
      const imgFile = document.getElementById('prodImgFile').files[0];

      const newItem = {
        id: Date.now().toString(),
        title: title,
        price: price,
        image: imgUrl || 'https://via.placeholder.com/200?text=Dog+Man'
      };

      if (imgFile) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          newItem.image = evt.target.result;
          products.push(newItem);
          renderStore();
          addProductForm.reset();
        };
        reader.readAsDataURL(imgFile);
      } else {
        products.push(newItem);
        renderStore();
        addProductForm.reset();
      }
    });

    window.deleteItem = function(id) {
      products = products.filter(p => p.id !== id);
      renderStore();
    };

    window.selectItem = function(id) {
      unlockAudio();
      const chk = document.getElementById(`chk-${id}`);
      if (chk) {
        chk.checked = true;
        document.getElementById('orderForm').scrollIntoView({ behavior: 'smooth' });
      }
    };

    // --- 6. Formspree Order Submission ---
    orderForm.addEventListener('submit', function() {
      const selectedBoxes = document.querySelectorAll('.order-chk:checked');
      const selectedItemsList = Array.from(selectedBoxes).map(b => b.value);
      finalOrderInput.value = selectedItemsList.join(', ') || 'No items checked';
    });

    // Initial Load
    renderStore();
  </script>
</body>
</html>
