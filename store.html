<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dog Man Marketplace</title>
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #ffcc00; /* Vibrant Yellow background */
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0088cc; /* Hero Blue header */
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 5px solid black;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border: 4px solid black;
      border-radius: 12px;
      padding: 15px;
      width: 220px;
      text-align: center;
      box-shadow: 5px 5px 0px black; /* Comic book shadow effect */
    }
    .card img {
      max-width: 120px;
      height: 120px;
      object-fit: contain;
    }
    .price {
      color: #ff3333; /* Supa Red price text */
      font-size: 1.3em;
      margin: 10px 0;
    }
    .buy-btn {
      background-color: #0088cc;
      color: white;
      border: 2px solid black;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>🐶 DOG MAN MARKETPLACE 🚨</h1>
  </header>

  <div id="product-container" class="grid">Loading Supa Products...</div>

  <script>
    fetch('https://fakestoreapi.com/products?limit=8')
      .then(res => res.json())
      .then(products => {
        const container = document.getElementById('product-container');
        container.innerHTML = products.map(item => `
          <div class="card">
            <img src="${item.image}" alt="${item.title}">
            <h4>${item.title.substring(0, 25)}...</h4>
            <div class="price">$${item.price}</div>
            <button class="buy-btn">Add to Bag</button>
          </div>
        `).join('');
      });
  </script>

</body>
</html>
