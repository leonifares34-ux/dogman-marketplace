<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Man Marketplace</title>

  <!-- Pusher JS Library -->
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }

    body {
      background-color: #ffcc00;
      color: #000000;
      padding-bottom: 50px;
    }

    header {
      background-color: #0088cc;
      color: #ffffff;
      text-align: center;
      padding: 14px 10px;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }

    main {
      max-width: 950px;
      margin: 20px auto;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .audio-card {
      background-color: #ffffff;
      border: 3px solid #000000;
      border-radius: 12px;
      padding: 14px 20px;
      text-align: center;
      box-shadow: 4px 4px 0px #000000;
      width: 100%;
      max-width: 360px;
    }

    .audio-card h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .btn-audio {
      background-color: #0088cc;
      color: #ffffff;
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 8px 16px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
      margin-bottom: 6px;
      width: 100%;
    }

    .audio-status {
      font-size: 0.75rem;
      color: #444444;
    }

    .flex-container {
      display: flex;
      gap: 16px;
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 700px) {
      .flex-container {
        flex-direction: column;
        align-items: center;
      }
    }

    .card-box {
      border: 3px solid #000000;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 4px 4px 0px #000000;
      flex: 1;
      width: 100%;
      max-width: 450px;
    }

    .card-box h2 {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 14px;
      font-weight: bold;
    }

    .sell-card {
      background-color: #ffffff;
    }

    .order-card {
      background-color: #0088cc;
      color: #ffffff;
    }

    .field-group {
      margin-bottom: 10px;
    }

    input[type="text"], input[type="url"], select {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid #000000;
      border-radius: 6px;
      font-size: 0.85rem;
      background-color: #ffffff;
      color: #000000;
      outline: none;
    }

    .or-divider {
      text-align: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #333333;
      margin: 4px 0;
    }

    .file-input-box {
      background: #ffffff;
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 4px;
    }

    .file-input-box input[type="file"] {
      width: 100%;
      font-size: 0.8rem;
    }

    .checkbox-box {
      background-color: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 10px;
      max-height: 120px;
      overflow-y: auto;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .checkbox-item input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .select-label {
      text-align: center;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .total-bar {
      background-color: #ffcc00;
      color: #000000;
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 10px;
      box-shadow: 1px 1px 0px #000000;
    }

    .btn-green {
      background-color: #00a844;
      color: #ffffff;
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 8px;
      font-weight: bold;
      width: 100%;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
    }

    .btn-red {
      background-color: #d92626;
      color: #ffffff;
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 8px;
      font-weight: bold;
      width: 100%;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
    }

    .products-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin-top: 10px;
    }

    .product-card {
      background-color: #ffffff;
      border: 3px solid #000000;
      border-radius: 12px;
      padding: 14px;
      width: 220px;
      text-align: center;
      box-shadow: 4px 4px 0px #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product-card img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .product-card h4 {
      font-size: 0.9rem;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .product-card .price {
      color: #d92626;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .btn-buy {
      background-color: #0088cc;
      color: #ffffff;
      border: 1.5px solid #000000;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 6px;
      width: 80%;
    }

    .btn-delete {
      background-color: #d92626;
      color: #ffffff;
      border: 1.5px solid #000000;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      width: 80%;
    }
  </style>
</head>
<body>

  <header>
    🐶 DOG MAN MARKETPLACE 🚨
  </header>

  <main>

    <div class="audio-card">
      <h3>🎵 Live Synced Announcement 🎵</h3>
      <button id="playAudioBtn" class="btn-audio">⏸️ Pause for Everyone</button>
      <div class="audio-status">Connected! Tap Play to sync.</div>
    </div>

    <div class="flex-container">

      <!-- Left Card -->
      <div class="card-box sell-card">
        <h2>⚡ Sell Supa Merch ⚡</h2>
        <form id="sellForm">
          <div class="field-group">
            <input type="text" id="itemName" placeholder="Item Name (e.g. , Supa Buddy Pin)" required>
          </div>
          <div class="field-group">
            <input type="text" id="itemPrice" placeholder="Price ($)" required>
          </div>
          <div class="field-group">
            <input type="url" id="itemImgUrl" placeholder="Paste Image URL (https://...)">
          </div>
          
          <div class="or-divider">– OR –<br>Upload Image File:</div>
          
          <div class="field-group file-input-box">
            <input type="file" id="itemImgFile" accept="image/*">
          </div>

          <button type="submit" class="btn-green">List Item!</button>
        </form>
      </div>

      <!-- Right Card -->
      <div class="card-box order-card">
        <h2>📦 Order & Choose Address 📦</h2>
        <form id="checkoutForm" action="https://formspree.io/f/maewbvzr" method="POST">
          
          <div class="field-group">
            <select id="userName" name="customer_name" required>
              <option value="" disabled selected>-- Select Your Name --</option>
              <option value="Arthur">Arthur</option>
              <option value="Denise">Denise</option>
              <option value="Josh">Josh</option>
              <option value="Luna">Luna</option>
            </select>
          </div>

          <div class="select-label">Select Items to Order:</div>

          <div id="checkboxContainer" class="checkbox-box">
            <!-- Items populated via JS -->
          </div>

          <div class="total-bar">
            Total Amount: $<span id="totalDisplay">0.00</span>
          </div>

          <div class="field-group">
            <select id="userAddress" name="delivery_address" required>
              <option value="" disabled selected>-- Select Delivery Address --</option>
              <option value="Arthur's House">Arthur's House</option>
              <option value="Denise's House">Denise's House</option>
              <option value="Josh's House">Josh's House</option>
              <option value="Luna's House">Luna's House</option>
            </select>
          </div>

          <input type="hidden" id="orderedItemsInput" name="ordered_items">
          <input type="hidden" id="totalAmountInput" name="total_amount">

          <button type="submit" class="btn-red">Submit Order!</button>
        </form>
      </div>

    </div>

    <!-- Product Grid -->
    <div id="productsGrid" class="products-container">
      <!-- Hardcoded / Loaded Products -->
    </div>

  </main>

  <audio id="syncAudio" src="sound.mp3" preload="auto"></audio>

  <script>
    const PUSHER_KEY = '3651c3c833375dea577d';
    const PUSHER_CLUSTER = 'eu';
    const CHANNEL_NAME = 'dogman-store';
    const EVENT_NAME = 'play-sound';

    // HARDCODED DEFAULT ITEMS (WILL NEVER DISAPPEAR ON REFRESH)
    const initialItems = [
      {
        id: 'default-1',
        name: 'Pikachu Federtasche',
        price: '5.00',
        image: 'https://m.media-amazon.com/images/I/71yR3A-E-LL.jpg'
      },
      {
        id: 'default-2',
        name: 'Dog Man Book Vol. 1',
        price: '9.99',
        image: 'https://m.media-amazon.com/images/I/81q6xP8a3FL.jpg'
      },
      {
        id: 'default-3',
        name: 'Petey Plushie',
        price: '14.99',
        image: 'https://m.media-amazon.com/images/I/71yR3A-E-LL.jpg'
      },
      {
        id: 'default-4',
        name: 'Bark Knight Badge',
        price: '4.99',
        image: 'https://m.media-amazon.com/images/I/61+R+xI2uBL.jpg'
      }
    ];

    // Read stored items or fallback to default hardcoded array
    let products = JSON.parse(localStorage.getItem('dogman_items'));
    if (!products || products.length === 0) {
      products = initialItems;
      localStorage.setItem('dogman_items', JSON.stringify(products));
    }

    const syncAudio = document.getElementById('syncAudio');
    const playAudioBtn = document.getElementById('playAudioBtn');
    const productsGrid = document.getElementById('productsGrid');
    const checkboxContainer = document.getElementById('checkboxContainer');
    const totalDisplay = document.getElementById('totalDisplay');
    const orderedItemsInput = document.getElementById('orderedItemsInput');
    const totalAmountInput = document.getElementById('totalAmountInput');

    let isAudioUnlocked = false;

    function unlockAudio() {
      if (isAudioUnlocked) return;
      syncAudio.play().then(() => {
        syncAudio.pause();
        syncAudio.currentTime = 0;
        isAudioUnlocked = true;
      }).catch(err => console.log('Audio pending interaction:', err));
    }

    document.addEventListener('click', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);

    const pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
    const channel = pusher.subscribe(CHANNEL_NAME);

    channel.bind(EVENT_NAME, function() {
      if (!isAudioUnlocked) return;
      syncAudio.currentTime = 0;
      syncAudio.play().catch(e => console.error(e));
    });

    playAudioBtn.addEventListener('click', () => {
      unlockAudio();
      syncAudio.currentTime = 0;
      syncAudio.play();
    });

    function renderStore() {
      localStorage.setItem('dogman_items', JSON.stringify(products));

      productsGrid.innerHTML = '';
      checkboxContainer.innerHTML = '';

      products.forEach((prod, index) => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${prod.image}" alt="${prod.name}" onerror="this.src='https://via.placeholder.com/150?text=Merch'">
          <h4>${prod.name}</h4>
          <div class="price">$${parseFloat(prod.price).toFixed(2)}</div>
          <button class="btn-buy" onclick="checkItemInForm(${index})">Buy Item</button>
          <button class="btn-delete" onclick="deleteItem('${prod.id}')">Delete Item</button>
        `;
        productsGrid.appendChild(card);

        const label = document.createElement('label');
        label.className = 'checkbox-item';
        label.innerHTML = `
          <input type="checkbox" class="item-chk" data-price="${prod.price}" value="${prod.name}" id="chk-${index}" onchange="calculateTotal()">
          ${prod.name} ($${parseFloat(prod.price).toFixed(2)})
        `;
        checkboxContainer.appendChild(label);
      });

      calculateTotal();
    }

    window.calculateTotal = function() {
      const checkboxes = document.querySelectorAll('.item-chk:checked');
      let sum = 0;
      let selectedNames = [];

      checkboxes.forEach(chk => {
        sum += parseFloat(chk.getAttribute('data-price')) || 0;
        selectedNames.push(chk.value);
      });

      totalDisplay.textContent = sum.toFixed(2);
      totalAmountInput.value = '$' + sum.toFixed(2);
      orderedItemsInput.value = selectedNames.join(', ');
    };

    document.getElementById('sellForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('itemName').value;
      const price = document.getElementById('itemPrice').value;
      const imgUrl = document.getElementById('itemImgUrl').value;
      const imgFile = document.getElementById('itemImgFile').files[0];

      const newItem = {
        id: Date.now().toString(),
        name: name,
        price: price,
        image: imgUrl || 'https://via.placeholder.com/150?text=Merch'
      };

      if (imgFile) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          newItem.image = evt.target.result;
          products.push(newItem);
          renderStore();
          document.getElementById('sellForm').reset();
        };
        reader.readAsDataURL(imgFile);
      } else {
        products.push(newItem);
        renderStore();
        document.getElementById('sellForm').reset();
      }
    });

    window.deleteItem = function(id) {
      products = products.filter(p => p.id !== id);
      renderStore();
    };

    window.checkItemInForm = function(index) {
      unlockAudio();
      const chk = document.getElementById(`chk-${index}`);
      if (chk) {
        chk.checked = true;
        calculateTotal();
      }
    };

    renderStore();
  </script>
</body>
</html>
