<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dog Man Marketplace</title>
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #ffcc00; /* Dog Man Yellow */
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0088cc; /* Hero Blue */
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 5px solid black;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 20px auto;
      max-width: 1100px;
      padding: 0 10px;
    }
    .seller-section, .checkout-section {
      background-color: #ffffff;
      border: 4px solid black;
      box-shadow: 5px 5px 0px black;
      flex: 1;
      min-width: 300px;
      max-width: 480px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-sizing: border-box;
    }
    .checkout-section {
      background-color: #0088cc;
      color: white;
    }
    .seller-section input, .checkout-section input, .checkout-section select {
      width: 90%;
      padding: 10px;
      margin: 6px 0;
      border: 3px solid black;
      border-radius: 6px;
      font-weight: bold;
      font-family: inherit;
      box-sizing: border-box;
    }
    .seller-btn {
      background-color: #28a745;
      color: white;
      font-size: 1em;
      border: 3px solid black;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
      margin-top: 10px;
      font-weight: bold;
    }
    .seller-btn:hover { background-color: #218838; }
    .order-btn {
      background-color: #ff3333;
      color: white;
      font-size: 1em;
      border: 3px solid black;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
      margin-top: 10px;
      font-weight: bold;
    }
    .order-btn:hover { background-color: #cc0000; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border: 4px solid black;
      border-radius: 12px;
      padding: 15px;
      width: 220px;
      text-align: center;
      box-shadow: 5px 5px 0px black;
    }
    .card img {
      max-width: 120px;
      height: 120px;
      object-fit: contain;
    }
    .price {
      color: #ff3333; /* Supa Red */
      font-size: 1.3em;
      margin: 10px 0;
    }
    .buy-btn {
      background-color: #0088cc;
      color: white;
      border: 2px solid black;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .delete-btn {
      background-color: #ff3333;
      color: white;
      border: 2px solid black;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .delete-btn:hover { background-color: #cc0000; }
  </style>
</head>
<body>

  <header>
    <h1>🐶 DOG MAN MARKETPLACE 🚨</h1>
  </header>

  <div class="container">
    <!-- 1. SELLER ADD ITEM SECTION -->
    <div class="seller-section">
      <h2>⚡ Sell Supa Merch ⚡</h2>
      <input type="text" id="title" placeholder="Item Name (e.g., Supa Buddy Pin)" required><br>
      <input type="number" id="price" placeholder="Price ($)" step="0.01" required><br>
      <input type="url" id="image" placeholder="Image URL (http://...)" required><br>
      <button class="seller-btn" onclick="addItem()">List Item for Sale!</button>
    </div>

    <!-- 2. CHECKOUT & ADDRESS SELECTION SECTION -->
    <div class="checkout-section">
      <h2>📦 Order & Choose Address 📦</h2>
      <input type="text" id="cust-name" placeholder="Your Name" required><br>
      <input type="text" id="cust-item" placeholder="Item Name Buying" required><br>
      
      <select id="cust-address" required>
        <option value="" disabled selected>-- Select Delivery Address --</option>
        <option value="Bomboklat street">Bomboklat street</option>
        <option value="Factory street">Factory street</option>
        <option value="Oral B Street">Oral B Street</option>
      </select><br>

      <button class="order-btn" onclick="sendOrder()">Submit Order!</button>
    </div>
  </div>

  <!-- MARKETPLACE PRODUCTS GRID -->
  <div id="product-container" class="grid">Loading Supa Products...</div>

  <script>
    // 1. Fetch initial products from FakeStoreAPI
    fetch('https://fakestoreapi.com/products?limit=6')
      .then(res => res.json())
      .then(products => {
        const container = document.getElementById('product-container');
        container.innerHTML = products.map(item => createCardHtml(item.title, item.price, item.image)).join('');
      });

    // 2. Helper function to create product cards with a Delete button
    function createCardHtml(title, price, image) {
      return `
        <div class="card">
          <img src="${image}" alt="${title}">
          <h4>${title.length > 25 ? title.substring(0, 25) + '...' : title}</h4>
          <div class="price">$${price}</div>
          <button class="buy-btn" onclick="quickBuy('${title.replace(/'/g, "\\'")}')">Buy Item</button><br>
          <button class="delete-btn" onclick="this.parentElement.remove()">Delete Pack</button>
        </div>
      `;
    }

    // 3. Function to add new seller item to the page
    function addItem() {
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const image = document.getElementById('image').value;

      if (!title || !price || !image) {
        alert('Please fill in all seller fields!');
        return;
      }

      const container = document.getElementById('product-container');
      const newCardHtml = createCardHtml(title, price, image);
      
      container.insertAdjacentHTML('afterbegin', newCardHtml);

      // Clear input fields
      document.getElementById('title').value = '';
      document.getElementById('price').value = '';
      document.getElementById('image').value = '';
    }

    // Helper function to auto-fill the item name when clicking "Buy Item"
    function quickBuy(itemTitle) {
      document.getElementById('cust-item').value = itemTitle;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 4. Function to send order details via Formspree Email
    function sendOrder() {
      const customer = document.getElementById('cust-name').value;
      const item = document.getElementById('cust-item').value;
      const address = document.getElementById('cust-address').value;

      if (!customer || !item || !address) {
        alert('Please fill in your name, item, and select an address!');
        return;
      }

      // 🔴 REPLACE WITH YOUR ACTUAL FORMSPREE ENDPOINT URL:
      const targetUrl = "https://formspree.io/f/maewbvzr";

      const orderData = {
        "Customer Name": customer,
        "Item Ordered": item,
        "Delivery Address": address
      };

      if (targetUrl.includes("YOUR_FORM_ID_HERE")) {
        alert(`Demo Mode Active!\n\nOrder Details:\nCustomer: ${customer}\nItem: ${item}\nAddress: ${address}\n\n(To receive real emails, replace YOUR_FORM_ID_HERE with your Formspree form ID!)`);
      } else {
        fetch(targetUrl, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(orderData)
        })
        .then(response => {
          if (response.ok) {
            alert(`Order Sent Successfully!\nAn email alert has been sent to the store owner.`);
            document.getElementById('cust-name').value = '';
            document.getElementById('cust-item').value = '';
            document.getElementById('cust-address').selectedIndex = 0;
          } else {
            alert('Error sending order. Please check your Formspree URL ID.');
          }
        })
        .catch(err => alert('Error sending order: ' + err));
      }
    }
  </script>

</body>
</html>
