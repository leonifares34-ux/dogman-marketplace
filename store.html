<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Man Marketplace</title>
  
  <!-- PieSocket JS for Real-Time Sync -->
  <script src="https://www.piesocket.com/v3/push.js"></script>
  
  <style>
    :root {
      --bg-color: #ffd700;
      --text-color: #000;
      --card-bg: #fff;
      --element-border: #000;
      --shadow-color: rgba(0, 0, 0, 0.2);
    }

    body.dark-mode {
      --bg-color: #1a1a1a;
      --text-color: #ffd700;
      --card-bg: #2a2a2a;
      --element-border: #ffd700;
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      text-align: center;
      padding: 10px;
      position: relative;
      border: 3px solid var(--element-border);
      border-radius: 12px;
      background: var(--card-bg);
      margin-bottom: 20px;
      box-shadow: 4px 4px 0px var(--element-border);
    }

    .theme-toggle {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 8px 12px;
      background: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--element-border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .sync-status-box {
      border: 2px solid var(--element-border);
      border-radius: 8px;
      padding: 10px;
      margin: 15px auto;
      max-width: 400px;
      background: var(--card-bg);
      box-shadow: 2px 2px 0px var(--element-border);
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .seller-section, .checkout-section {
      background: var(--card-bg);
      border: 3px solid var(--element-border);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 6px 6px 0px var(--element-border);
    }

    .seller-section h2, .checkout-section h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 2px solid var(--element-border);
      padding-bottom: 8px;
    }

    .seller-section input, .seller-section select, .checkout-section select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      box-sizing: border-box;
      border: 2px solid var(--element-border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text-color);
      font-weight: bold;
    }

    .seller-section button, .checkout-section button {
      width: 100%;
      padding: 10px;
      background-color: #2ed573;
      color: #000;
      border: 2px solid var(--element-border);
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--element-border);
    }

    .address-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
      border: 2px solid var(--element-border);
      padding: 8px;
      border-radius: 6px;
      background: var(--bg-color);
      margin-top: 10px;
      text-align: left;
    }

    .address-card {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      background: var(--card-bg);
      border: 2px solid var(--element-border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .address-card.selected {
      background-color: #ff4757;
      color: #fff;
    }

    .search-filter-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    #searchInput {
      padding: 10px;
      width: 100%;
      max-width: 450px;
      border: 2px solid var(--element-border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-color);
      font-weight: bold;
    }

    .filter-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-chip {
      padding: 6px 12px;
      background: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--element-border);
      border-radius: 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      box-shadow: 2px 2px 0px var(--element-border);
    }

    .filter-chip.active {
      background-color: #ff4757;
      color: #fff;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      position: relative;
      width: 150px;
      border: 2px solid var(--element-border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--card-bg);
      padding: 10px;
      box-shadow: 4px 4px 0px var(--element-border);
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border: 2px solid var(--element-border);
      border-radius: 4px;
    }

    .product-card h3 {
      font-size: 0.9rem;
      margin: 8px 0 4px 0;
    }

    .product-card .price {
      font-weight: bold;
      color: #ff4757;
      margin: 0 0 8px 0;
    }

    .buy-btn {
      background-color: #1e90ff;
      color: #fff;
      border: 2px solid var(--element-border);
      padding: 6px;
      width: 100%;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #ff4757;
      border: 2px solid var(--element-border);
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 0.7rem;
    }

    .ribbon {
      width: 80px;
      height: 80px;
      overflow: hidden;
      position: absolute;
      top: -8px;
      right: -8px;
      z-index: 10;
      pointer-events: none;
    }

    .ribbon span {
      position: absolute;
      display: block;
      width: 110px;
      padding: 4px 0;
      background-color: #ff4757;
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      left: -15px;
      top: 18px;
      transform: rotate(45deg);
    }
  </style>
</head>
<body class="page-body">

  <header>
    <button class="theme-toggle" onclick="toggleDarkMode()">Light Mode</button>
    <h1>🐶 DOG MAN MARKETPLACE 🐱</h1>
    
    <div class="sync-status-box">
      <div style="font-weight: bold; margin-bottom: 5px;">🎶 Live Synced Announcement 🎶</div>
      <input type="text" id="announcementInput" value="kontnaa na shop" oninput="broadcastAnnouncement()" style="padding: 6px; width: 80%; border: 2px solid var(--element-border); border-radius: 4px; font-weight: bold;">
      <div style="margin-top: 8px; display: flex; gap: 8px; justify-content: center;">
        <button onclick="toggleAudio()" id="audioToggleBtn" style="background: #1e90ff; color: #fff; border: 2px solid var(--element-border); padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">▶ Play for Everyone</button>
      </div>
      <div id="statusText" style="font-size: 0.8rem; margin-top: 5px; font-weight: bold;">Connected: Tap Play to sync.</div>
    </div>
    
    <!-- Audio & Playlist Element -->
    <audio id="audioStream" loop>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    <select id="audioSelect" onchange="changeTrackAndBroadcast()" style="margin-top: 5px; padding: 4px; border: 2px solid var(--element-border); border-radius: 4px; font-weight: bold;">
      <option value="0">SoundHelix Track 1</option>
      <option value="1">SoundHelix Track 2</option>
    </select>
  </header>

  <div class="container">
    <!-- Sell Section -->
    <section class="seller-section">
      <h2>💸 Sell Supa Merch</h2>
      <input type="text" id="itemTitle" placeholder="Item Name (e.g., Supa Buddy Pin)">
      <input type="number" id="itemPrice" placeholder="Price in DZD" step="0.01">
      <input type="text" id="itemImage" placeholder="Paste Image URL (or local path)">
      <div style="font-weight: bold; font-size: 0.85rem; margin: 6px 0;">— OR —</div>
      <input type="file" id="imageFile" accept="image/*" style="font-size: 0.85rem; margin-bottom: 10px;">
      <button onclick="addNewItem()">List Item!</button>
    </section>

    <!-- Order & Checkout Section -->
    <section class="checkout-section">
      <h2>🛒 Order & Choose Address</h2>
      <select id="itemSelect" onchange="updateTotal()">
        <option value="">-- Select Item to Order --</option>
      </select>
      
      <div style="font-weight: bold; margin-top: 10px;">Select Items to Order:</div>
      <div id="checkboxItemsContainer" class="address-grid" style="max-height: 100px;">
        <!-- Checkboxes for items -->
      </div>

      <div style="font-weight: bold; margin-top: 10px; font-size: 1.1rem;" id="totalDisplay">Total Amount: 0.00 DZD</div>
      
      <div style="font-weight: bold; margin-top: 10px;">Select Delivery Address:</div>
      <div class="address-grid" id="addressGrid">
        <label class="address-card"><input type="radio" name="address" value="Dogbunker Street 1" onclick="updateAddressSelection()"> Dogbunker Street 1</label>
        <label class="address-card"><input type="radio" name="address" value="Supa Skyscraper" onclick="updateAddressSelection()"> Supa Skyscraper</label>
        <label class="address-card"><input type="radio" name="address" value="Factory Street" onclick="updateAddressSelection()"> Factory Street</label>
        <label class="address-card"><input type="radio" name="address" value="808 Street" onclick="updateAddressSelection()"> 808 Street</label>
        <label class="address-card"><input type="radio" name="address" value="Bark Street" onclick="updateAddressSelection()"> Bark Street</label>
        <label class="address-card"><input type="radio" name="address" value="Garage Street" onclick="updateAddressSelection()"> Garage Street</label>
        <label class="address-card"><input type="radio" name="address" value="Garden Street" onclick="updateAddressSelection()"> Garden Street</label>
        <label class="address-card"><input type="radio" name="address" value="Trampoline" onclick="updateAddressSelection()"> Trampoline</label>
      </div>
      
      <button onclick="submitOrder()" style="margin-top: 15px; background-color: #ff4757; color: #fff;">Submit Order!</button>
    </section>
  </div>

  <!-- Search & Filters -->
  <div class="search-filter-bar">
    <input type="text" id="searchInput" placeholder="Search items (e.g., Dog Man, Squishy, Purse)..." onkeyup="filterProducts()">
    <div class="filter-chips">
      <button class="filter-chip active" onclick="setCategory('all')">All Items</button>
      <button class="filter-chip" onclick="setCategory('dog man')">Dog Man</button>
      <button class="filter-chip" onclick="setCategory('squishies')">Squishies</button>
      <button class="filter-chip" onclick="setCategory('algeria')">Algerian</button>
      <button class="filter-chip" onclick="setCategory('hot')">🔥 Hot</button>
    </div>
  </div>

  <!-- Product Grid -->
  <main class="grid" id="productGrid">
    <!-- Dynamic products loaded here -->
  </main>

  <script>
    const defaultProducts = [
      { id: 'prod_1', title: 'Algerian Flag & Algeria Souvenir', price: 950.00, image: 'https://via.placeholder.com/150?text=Algeria', category: 'algeria', isHot: true },
      { id: 'prod_2', title: 'Mickey Squishy', price: 1050.00, image: 'https://via.placeholder.com/150?text=Mickey', category: 'squishies', isHot: false },
      { id: 'prod_3', title: 'Spedi Squishy', price: 750.00, image: 'https://via.placeholder.com/150?text=Spedi', category: 'squishies', isHot: false },
      { id: 'prod_4', title: 'Dog Man 12', price: 1650.00, image: 'https://via.placeholder.com/150?text=DogMan12', category: 'dog man', isHot: true },
      { id: 'prod_5', title: 'Dog Man 11', price: 1650.00, image: 'https://via.placeholder.com/150?text=DogMan11', category: 'dog man', isHot: false },
      { id: 'prod_6', title: 'Dog Man 10', price: 1650.00, image: 'https://via.placeholder.com/150?text=DogMan10', category: 'dog man', isHot: false }
    ];

    let productsList = [];
    let currentCategory = 'all';

    // PieSocket Initialization
    let pusher = null;
    let channel = null;

    try {
      pusher = new Pusher('YOUR_APP_KEY', {
        cluster: 'eu',
        forceTLS: true
      });
      channel = pusher.subscribe('dogman-room');
      
      channel.bind('client-audio-control', function(data) {
        const audioEl = document.getElementById('audioStream');
        const audioSelect = document.getElementById('audioSelect');
        audioSelect.value = data.track;
        audioEl.currentTime = data.time;
        if (data.action === 'play') {
          audioEl.play().catch(e => console.log(e));
          isPlaying = true;
          document.getElementById('audioToggleBtn').textContent = '⏸ Pause Broadcast';
          document.getElementById('statusText').textContent = 'Synced: Playing!';
        } else {
          audioEl.pause();
          isPlaying = false;
          document.getElementById('audioToggleBtn').textContent = '▶ Play for Everyone';
          document.getElementById('statusText').textContent = 'Synced: Paused.';
        }
      });
    } catch(err) {
      console.log('Pusher initialized locally or fallback mode');
    }

    function loadProducts() {
      const saved = localStorage.getItem('dogman_dzd_products');
      productsList = saved ? JSON.parse(saved) : [...defaultProducts];
      updateDropdownAndCheckboxes();
      displayProducts();
    }

    function saveProducts() {
      localStorage.setItem('dogman_dzd_products', JSON.stringify(productsList));
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const btn = document.querySelector('.theme-toggle');
      btn.textContent = document.body.classList.contains('dark-mode') ? 'Dark Mode' : 'Light Mode';
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.classList.toggle('active', chip.textContent.toLowerCase().includes(cat) || (cat === 'all' && chip.textContent === 'All Items'));
      });
      displayProducts();
    }

    function displayProducts() {
      const grid = document.getElementById('productGrid');
      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = productsList.filter(item => {
        const matchesCat = currentCategory === 'all' || 
                           item.category === currentCategory || 
                           (currentCategory === 'hot' && item.isHot) ||
                           item.title.toLowerCase().includes(currentCategory);
        const matchesSearch = item.title.toLowerCase().includes(query) || item.id.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="font-weight: bold; width: 100%; text-align: center;">No products found.</p>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="product-card">
          ${item.isHot ? '<div class="ribbon"><span>Hot</span></div>' : ''}
          <button class="delete-btn" onclick="deleteProduct('${item.id}')">🗑️</button>
          <img src="${item.image}" alt="${item.title}">
          <h3>${item.title}</h3>
          <p class="price">${item.price.toFixed(2)} DZD</p>
          <button class="buy-btn" onclick="selectItemForOrder('${item.id}')">Buy Item</button>
        </div>
      `).join('');
    }

    function updateDropdownAndCheckboxes() {
      const select = document.getElementById('itemSelect');
      select.innerHTML = '<option value="">-- Select Item to Order --</option>' + 
        productsList.map(item => `<option value="${item.id}">${item.title} (${item.price.toFixed(2)} DZD)</option>`).join('');

      const checkboxContainer = document.getElementById('checkboxItemsContainer');
      checkboxContainer.innerHTML = productsList.map(item => `
        <label><input type="checkbox" value="${item.id}" onchange="updateTotal()"> ${item.title} (${item.price.toFixed(2)} DZD)</label>
      `).join('');
    }

    function updateTotal() {
      let total = 0;
      const selectedDropdownId = document.getElementById('itemSelect').value;
      if (selectedDropdownId) {
        const mainItem = productsList.find(p => p.id === selectedDropdownId);
        if (mainItem) total += mainItem.price;
      }

      const checkedBoxes = document.querySelectorAll('#checkboxItemsContainer input[type="checkbox"]:checked');
      checkedBoxes.forEach(cb => {
        const item = productsList.find(p => p.id === cb.value);
        if (item) total += item.price;
      });

      document.getElementById('totalDisplay').textContent = `Total Amount: ${total.toFixed(2)} DZD`;
    }

    function selectItemForOrder(id) {
      document.getElementById('itemSelect').value = id;
      updateTotal();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateAddressSelection() {
      document.querySelectorAll('.address-card').forEach(card => {
        const radio = card.querySelector('input[type="radio"]');
        if (radio && radio.checked) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
      });
    }

    function addNewItem() {
      const title = document.getElementById('itemTitle').value.trim();
      const price = parseFloat(document.getElementById('itemPrice').value);
      let image = document.getElementById('itemImage').value.trim();
      const fileInput = document.getElementById('imageFile');

      if (!title || isNaN(price)) {
        alert('Please fill in a valid title and price in DZD.');
        return;
      }

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          saveNewProductWithImage(title, price, e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        if (!image) image = 'https://via.placeholder.com/150?text=Item';
        saveNewProductWithImage(title, price, image);
      }
    }

    function saveNewProductWithImage(title, price, image) {
      let category = 'all';
      let isHot = false;
      const lower = title.toLowerCase();
      if (lower.includes('algeria') || lower.includes('algerian')) category = 'algeria';
      else if (lower.includes('squishy')) category = 'squishies';
      else if (lower.includes('dog man')) category = 'dog man';
      
      if (lower.includes('hot') || price > 1500) isHot = true;

      productsList.push({ id: 'prod_' + Date.now(), title, price, image, category, isHot });
      saveProducts();
      updateDropdownAndCheckboxes();
      displayProducts();

      document.getElementById('itemTitle').value = '';
      document.getElementById('itemPrice').value = '';
      document.getElementById('itemImage').value = '';
      document.getElementById('imageFile').value = '';
    }

    function deleteProduct(id) {
      productsList = productsList.filter(p => p.id !== id);
      saveProducts();
      updateDropdownAndCheckboxes();
      displayProducts();
    }

    function submitOrder() {
      const selectedAddress = document.querySelector('input[name="address"]:checked');
      if (!selectedAddress) {
        alert('Please select a delivery address!');
        return;
      }

      const selectedItemsCount = document.querySelectorAll('#checkboxItemsContainer input[type="checkbox"]:checked').length;
      const mainDropdown = document.getElementById('itemSelect').value;
      if (!mainDropdown && selectedItemsCount === 0) {
        alert('Please select at least one item to order!');
        return;
      }

      // Formspree Integration Hook
      fetch('https://formspree.io/f/your_form_id', {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `New Order! Address: ${selectedAddress.value}`,
          total: document.getElementById('totalDisplay').textContent
        })
      }).then(response => {
        if (response.ok) {
          alert(`Order placed successfully to ${selectedAddress.value}!`);
          document.querySelectorAll('#checkboxItemsContainer input[type="checkbox"]').forEach(cb => cb.checked = false);
          document.getElementById('itemSelect').value = '';
          updateTotal();
        } else {
          alert('Error submitting order.');
        }
      }).catch(error => {
        alert(`Order placed successfully to ${selectedAddress.value}! (Offline mode)`);
      });
    }

    // Audio & PieSocket Sync Logic
    let isPlaying = false;
    const audio = document.getElementById('audioStream');

    function toggleAudio() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById('audioToggleBtn').textContent = '▶ Play for Everyone';
        document.getElementById('statusText').textContent = 'Playback Paused.';
        if (channel) {
          channel.trigger('client-audio-control', { action: 'pause', time: audio.currentTime, track: document.getElementById('audioSelect').value });
        }
      } else {
        audio.play().then(() => {
          isPlaying = true;
          document.getElementById('audioToggleBtn').textContent = '⏸ Pause Broadcast';
          document.getElementById('statusText').textContent = 'Playing in sync!';
          if (channel) {
            channel.trigger('client-audio-control', { action: 'play', time: audio.currentTime, track: document.getElementById('audioSelect').value });
          }
        }).catch(err => {
          alert('Tap anywhere on screen to allow audio playback!');
        });
      }
    }

    function changeTrackAndBroadcast() {
      const trackIndex = document.getElementById('audioSelect').value;
      const tracks = [
        'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
        'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'
      ];
      audio.src = tracks[trackIndex] || tracks[0];
      audio.currentTime = 0;
      if (isPlaying) {
        audio.play();
        if (channel) {
          channel.trigger('client-audio-control', { action: 'play', time: 0, track: trackIndex });
        }
      }
    }

    function broadcastAnnouncement() {
      // Real-time broadcast sync hook
    }

    window.onload = loadProducts;
  </script>
</body>
</html>
