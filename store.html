<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dog Man Marketplace</title>
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #ffcc00;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0088cc;
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 5px solid black;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 20px auto;
      max-width: 1100px;
      padding: 0 10px;
    }
    .seller-section, .checkout-section {
      background-color: #ffffff;
      border: 4px solid black;
      box-shadow: 5px 5px 0px black;
      flex: 1;
      min-width: 300px;
      max-width: 480px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-sizing: border-box;
    }
    .checkout-section {
      background-color: #0088cc;
      color: white;
    }
    .seller-section input, .checkout-section input, .checkout-section select {
      width: 90%;
      padding: 10px;
      margin: 6px 0;
      border: 3px solid black;
      border-radius: 6px;
      font-weight: bold;
      font-family: inherit;
      box-sizing: border-box;
    }
    .item-checkbox-container {
      background: white;
      color: black;
      border: 3px solid black;
      border-radius: 6px;
      padding: 10px;
      max-height: 150px;
      overflow-y: auto;
      text-align: left;
      margin: 8px auto;
      width: 90%;
      box-sizing: border-box;
    }
    .item-checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .item-checkbox-row input[type="checkbox"] {
      width: auto;
      margin: 0;
      transform: scale(1.3);
      cursor: pointer;
    }
    .item-checkbox-row label {
      font-weight: bold;
      font-size: 0.9em;
      cursor: pointer;
    }
    .seller-btn {
      background-color: #28a745;
      color: white;
      font-size: 1em;
      border: 3px solid black;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
      margin-top: 10px;
      font-weight: bold;
    }
    .seller-btn:hover { background-color: #218838; }
    .order-btn {
      background-color: #ff3333;
      color: white;
      font-size: 1em;
      border: 3px solid black;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
      margin-top: 10px;
      font-weight: bold;
    }
    .order-btn:hover { background-color: #cc0000; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border: 4px solid black;
      border-radius: 12px;
      padding: 15px;
      width: 220px;
      text-align: center;
      box-shadow: 5px 5px 0px black;
    }
    .card img {
      max-width: 120px;
      height: 120px;
      object-fit: contain;
    }
    .price {
      color: #ff3333;
      font-size: 1.3em;
      margin: 10px 0;
    }
    .buy-btn {
      background-color: #0088cc;
      color: white;
      border: 2px solid black;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .delete-btn {
      background-color: #ff3333;
      color: white;
      border: 2px solid black;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .delete-btn:hover { background-color: #cc0000; }
  </style>
</head>
