<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Man Marketplace</title>
    <!-- Pusher Script -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        :root {
            --bg-color: #ffcc00;
            --text-color: #000000;
            --card-bg: #ffffff;
            --card-color: #000000;
            --element-border: #000000;
            --header-bg: #ffaa00;
            --checkout-bg: #fffbe6;
            --box-shadow: 4px 4px 0px #000000;
            --small-shadow: 2px 2px 0px #000000;
        }

        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --card-bg: #2d2d2d;
            --card-color: #ffffff;
            --element-border: #ffffff;
            --header-bg: #333333;
            --checkout-bg: #262626;
            --box-shadow: 4px 4px 0px rgba(255, 255, 255, 0.4);
            --small-shadow: 2px 2px 0px rgba(255, 255, 255, 0.4);
        }

        body {
            font-family: 'Arial Black', Impact, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background-color: var(--header-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--element-border);
            position: relative;
            transition: background-color 0.3s, border-color 0.3s;
        }

        body.dark-mode header {
            background-color: #1f1f1f;
        }

        .theme-toggle-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--element-border);
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: var(--small-shadow);
            font-family: inherit;
            transition: transform 0.1s, box-shadow: 0.1s;
        }

        .theme-toggle-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .seller-section, .checkout-section {
            background-color: var(--checkout-bg);
            border: 4px solid var(--element-border);
            border-radius: 12px;
            box-shadow: var(--box-shadow);
            padding: 20px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .seller-section input-input, .checkout-section input, .checkout-section select, .audio-select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid var(--element-border);
            border-radius: 4px;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .item-checkbox-container {
            max-height: 150px;
            overflow-y: auto;
            border: 2px solid var(--element-border);
            padding: 10px;
            text-align: left;
            background: var(--card-bg);
            margin: 10px 0;
            border-radius: 4px;
        }

        .item-checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        /* Scrollable Address Card Grid */
        .address-grid {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
            justify-content: center;
            max-height: 250px;
            box-sizing: border-box;
        }

        .address-card {
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--element-border);
            border-radius: 8px;
            padding: 10px;
            min-width: 150px;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--small-shadow);
            transition: transform 0.1s, border-color 0.3s, background-color 0.3s;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .address-card:hover {
            transform: translateY(-2px);
        }

        .address-card input[type="radio"] {
            display: none;
        }

        .address-card img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 4px;
            border: 1px solid var(--element-border);
        }

        .address-card span {
            font-size: 12px;
            line-height: 1.1;
            font-weight: bold;
        }

        .address-card-selected {
            border-color: #ff3333;
            background-color: #ffe6e6;
            color: #000000;
        }

        .seller-box {
            background: #ffe6e6;
            border: 2px solid var(--element-border);
            font-size: 14px;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            box-shadow: var(--small-shadow);
        }

        /* Search & Filter Bar Styles */
        .search-filter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 20px auto;
            max-width: 800px;
            padding: 0 20px;
        }

        .search-row {
            display: flex;
            width: 100%;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #search-input {
            width: 60%;
            padding: 12px;
            font-size: 16px;
            border: 3px solid var(--element-border);
            border-radius: 8px;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text-color);
            box-shadow: var(--small-shadow);
        }

        .surprise-btn {
            background-color: #ff3333;
            color: #ffffff;
            border: 3px solid var(--element-border);
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--small-shadow);
            font-family: inherit;
            transition: transform 0.1s;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-chip {
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--element-border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--small-shadow);
            font-family: inherit;
            transition: transform 0.1s, background-color 0.3s;
        }

        .filter-chip.active {
            background-color: #ff3333;
            color: #ffffff;
        }

        /* Grid for products */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            color: var(--card-color);
            border: 3px solid var(--element-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--box-shadow);
            position: relative;
            transition: transform 0.2s, background-color 0.3s;
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .card-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .ribbon {
            background: #ff3333;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--element-border);
        }

        .delete-btn {
            background: #ff3333;
            color: #ffffff;
            border: 2px solid var(--element-border);
            border-radius: 4px;
            font-size: 12px;
            padding: 2px 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .price {
            font-size: 16px;
            font-weight: bold;
            color: #ff3333;
        }

        .buy-btn {
            background: #00cc44;
            color: #ffffff;
            border: 2px solid var(--element-border);
            border-radius: 6px;
            padding: 8px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            margin-top: 8px;
        }

        .total-box {
            border: 2px dashed var(--element-border);
            padding: 6px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <button class="theme-toggle-btn" onclick="toggleDarkMode()">🌙 Night Mode</button>
        <h1>DOG MAN MARKETPLACE</h1>
    </header>

    <div class="search-filter-container">
        <div class="search-row">
            <input type="text" id="search-input" placeholder="Search items (e.g., Dog Man, Squishy, Purse)..." oninput="displayProducts()">
            <button class="surprise-btn" onclick="surpriseMe()">Surprise Me! 🎁</button>
        </div>
        <div class="filter-chips">
            <button class="filter-chip active" onclick="setCategory('all')">All Items</button>
            <button class="filter-chip" onclick="setCategory('dogman')">Dog Man</button>
            <button class="filter-chip" onclick="setCategory('stitch')">Stitch</button>
            <button class="filter-chip" onclick="setCategory('expensive')">Expensive (> $40)</button>
        </div>
    </div>

    <div class="container">
        <!-- SELLER SECTION -->
        <div class="seller-section">
            <h2>🛒 Sell Mega Merch</h2>
            <input type="text" id="title" placeholder="Title (e.g., Super Buddy Figurine)" required>
            <input type="number" id="price" placeholder="Price ($)" step="0.01" required>
            <input type="text" id="image" placeholder="Paste Image URL (https://...)">
            <input type="file" id="imageFile" accept="image/*" style="display: block; margin: 10px auto;">
            <button class="seller-box" onclick="addItem()">List Item (Upload)</button>
        </div>

        <!-- ORDER SECTION -->
        <div class="checkout-section">
            <h2>📦 Order & Choose Address</h2>
            <select id="customer" onchange="updateTotal()">
                <option value="" disabled selected>-- Select Your Name --</option>
                <option value="Arthur">Arthur</option>
                <option value="Dora">Dora</option>
                <option value="Lara">Lara</option>
            </select>
            <div style="margin: 10px 0; font-weight: bold;">Select Items to Order:</div>
            <div class="item-checkbox-container" id="item-checkboxes">
                <!-- Checkboxes populated via JS -->
            </div>
            <div class="total-box">Total Amount: <span id="total-sum">$0.00</span></div>
            <div style="font-weight: bold; margin-top: 10px;">Select Delivery Address:</div>
            <div class="address-grid">
                <label class="address-card" onclick="selectAddress(this)">
                    <input type="radio" name="address" value="Bodokubal Street 1">
                    <img src="https://via.placeholder.com/100?text=Bodokubal+1">
                    <span>Bodokubal Street 1</span>
                </label>
                <label class="address-card" onclick="selectAddress(this)">
                    <input type="radio" name="address" value="Lower Street 2">
                    <img src="https://via.placeholder.com/100?text=Lower+Street+2">
                    <span>Lower Street 2</span>
                </label>
                <label class="address-card" onclick="selectAddress(this)">
                    <input type="radio" name="address" value="Test Factory">
                    <img src="https://via.placeholder.com/100?text=Test-Factory">
                    <span>Test Factory</span>
                </label>
                <label class="address-card" onclick="selectAddress(this)">
                    <input type="radio" name="address" value="Dralel">
                    <img src="https://via.placeholder.com/100?text=Dralel">
                    <span>Dralel</span>
                </label>
                <label class="address-card" onclick="selectAddress(this)">
                    <input type="radio" name="address" value="Flower Flower">
                    <img src="https://via.placeholder.com/100?text=Flower+Flower">
                    <span>Flower Flower</span>
                </label>
                <label class="address-card" onclick="selectAddress(this)">
                    <input type="radio" name="address" value="Garage Street 1">
                    <img src="https://via.placeholder.com/100?text=Garage+Street+1">
                    <span>Garage Street 1</span>
                </label>
                <label class="address-card" onclick="selectAddress(this)">
                    <input type="radio" name="address" value="Garden Garden">
                    <img src="https://via.placeholder.com/100?text=Garden+Garden">
                    <span>Garden Garden</span>
                </label>
                <label class="address-card" onclick="sizeAddress(this)">
                    <input type="radio" name="address" value="Trampoline Street">
                    <img src="https://via.placeholder.com/100?text=Trampoline">
                    <span>Trampoline Street</span>
                </label>
            </div>
            <button class="buy-btn" onclick="sendOrder()" style="width: 100%; margin-top: 10px;">Submit Order</button>
        </div>
    </div>

    <!-- Product Grid -->
    <div id="product-container" class="grid"></div>

    <script>
        const defaultProducts = [
            { id: 'def_01', title: 'Algerian Flag Lesezeichen', price: 0.00, image: 'https://via.placeholder.com/200?text=Algerian+Flag' },
            { id: 'def_02', title: 'Aloha Hawaii Federtasche', price: 4.00, image: 'https://via.placeholder.com/200?text=Aloha+Hawaii' },
            { id: 'def_03', title: 'Pink Purse', price: 20.00, image: 'https://via.placeholder.com/200?text=Pink+Purse' },
            { id: 'def_04', title: 'Blue Purse', price: 20.00, image: 'https://via.placeholder.com/200?text=Blue+Purse' },
            { id: 'def_05', title: 'Pink Pouch', price: 15.00, image: 'https://via.placeholder.com/200?text=Pink+Pouch' },
            { id: 'def_06', title: 'Small Star Fidget', price: 5.00, image: 'https://via.placeholder.com/200?text=Small+Star' },
            { id: 'def_07', title: 'Blue Star Fidget', price: 5.00, image: 'https://via.placeholder.com/200?text=Blue+Star' },
            { id: 'def_08', title: 'Cake Squishy', price: 7.00, image: 'https://via.placeholder.com/200?text=Cake+Squishy' },
            { id: 'def_09', title: 'Mickey Squishy', price: 7.00, image: 'https://via.placeholder.com/200?text=Mickey+Squishy' },
            { id: 'def_10', title: 'Banana Kid Saichy', price: 4.00, image: 'https://via.placeholder.com/200?text=Banana+Saichy' },
            { id: 'def_11', title: 'Questionmark Rubiks Cube', price: 9.00, image: 'https://via.placeholder.com/200?text=Rubiks+Cube' },
            { id: 'def_12', title: 'Squishy Squishy', price: 7.00, image: 'https://via.placeholder.com/200?text=Squishy' },
            { id: 'def_13', title: 'Gedagagedigagedago ...', price: 1.00, image: 'https://via.placeholder.com/200?text=Gedagagedigagedago' },
            { id: 'def_14', title: 'Stitch Federfasche', price: 3.00, image: 'https://via.placeholder.com/200?text=Stitch+Federfasche' },
            { id: 'def_15', title: 'Stitch Federetasche', price: 4.00, image: 'https://via.placeholder.com/200?text=Stitch+Federetasche' },
            { id: 'def_16', title: 'Stitch Geldbörse', price: 5.00, image: 'https://via.placeholder.com/200?text=Stitch+Geldbörse' },
            { id: 'def_17', title: 'Stitch Kosmetiktasche', price: 6.00, image: 'https://via.placeholder.com/200?text=Stitch+Kosmetik' },
            { id: 'def_18', title: 'Stitch Rucksack', price: 15.00, image: 'https://via.placeholder.com/200?text=Stitch+Rucksack' },
            { id: 'def_19', title: 'Egg Löschkoffer', price: 1.00, image: 'https://via.placeholder.com/200?text=Egg+Löschkoffer' },
            { id: 'def_20', title: 'Cinnamoroll Löschkoffer', price: 1.00, image: 'https://via.placeholder.com/200?text=Cinnamoroll' },
            { id: 'def_21', title: 'Dog Man 1', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+1' },
            { id: 'def_22', title: 'Dog Man 2', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+2' },
            { id: 'def_23', title: 'Dog Man 3', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+3' },
            { id: 'def_24', title: 'Dog Man 4', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+4' },
            { id: 'def_25', title: 'Dog Man 5', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+5' },
            { id: 'def_26', title: 'Dog Man 6', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+6' },
            { id: 'def_27', title: 'Dog Man 7', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+7' },
            { id: 'def_28', title: 'Dog Man 8', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+8' },
            { id: 'def_29', title: 'Dog Man 9', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+9' },
            { id: 'def_30', title: 'Dog Man 10', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+10' },
            { id: 'def_31', title: 'Dog Man 11', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+11' },
            { id: 'def_32', title: 'Dog Man 12', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan+12' }
        ];

        let productsList = [];
        let currentFilter = 'all';

        try {
            const saved = localStorage.getItem('dogman_products');
            if (saved) {
                productsList = JSON.parse(saved);
            } else {
                productsList = [...defaultProducts];
            }
        } catch (e) {
            productsList = [...defaultProducts];
        }

        function saveLocalStorge() {
            try {
                localStorage.setItem('dogman_products', JSON.stringify(productsList));
            } catch (e) {
                console.error("Error saving to localStorage", e);
            }
        }

        function setCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            displayProducts();
        }

        function selectAddress(card) {
            document.querySelectorAll('.address-card').forEach(c => c.classList.remove('address-card-selected'));
            card.classList.add('address-card-selected');
            const radio = card.querySelector('input[type="radio"]');
            if (radio) radio.checked = true;
        }

        function toggleDarkMode() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            const btn = document.querySelector('.theme-toggle-btn');
            if (body.classList.contains('dark-mode')) {
                btn.innerHTML = '☀️ Light Mode';
            } else {
                btn.innerHTML = '🌙 Night Mode';
            }
        }

        function surpriseMe() {
            if (productsList.length === 0) return;
            const randIndex = Math.floor(Math.random() * productsList.length);
            document.getElementById('search-input').value = productsList[randIndex].title;
            displayProducts();
        }

        function updateCheckboxes() {
            const container = document.getElementById('item-checkboxes');
            if (!container) return;

            if (productsList.length === 0) {
                container.innerHTML = '<p style="color: gray; margin: 0;">No items available.</p>';
                return;
            }

            const checkedIDs = Array.from(document.querySelectorAll('#item-checkboxes input[type="checkbox"]:checked'))
                .map(cb => cb.value);

            container.innerHTML = productsList.map(item => {
                const isChecked = checkedIDs.includes(String(item.id)) ? 'checked' : '';
                return `
                    <div class="item-checkbox-row">
                        <input type="checkbox" id="chk_${item.id}" value="${item.id}" ${isChecked} onchange="updateTotal()">
                        <label for="chk_${item.id}">${item.title} ($${Number(item.price).toFixed(2)})</label>
                    </div>
                `;
            }).join('');
        }

        function updateTotal() {
            const checkboxes = document.querySelectorAll('#item-checkboxes input[type="checkbox"]:checked');
            let total = 0;

            checkboxes.forEach(chk => {
                const product = productsList.find(p => String(p.id) === String(chk.value));
                if (product) total += parseFloat(product.price) || 0;
            });

            const totalDisplay = document.getElementById('total-sum');
            if (totalDisplay) totalDisplay.innerText = `$${total.toFixed(2)}`;
        }

        function displayProducts() {
            const container = document.getElementById('product-container');
            if (!container) return;

            updateCheckboxes();

            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            const filteredProducts = productsList.filter(item => {
                const titleLower = item.title.toLowerCase();
                const matchesSearch = titleLower.includes(searchQuery);

                let matchesCategory = true;
                if (currentFilter === 'dogman') {
                    matchesCategory = titleLower.includes('dog man') || titleLower.includes('dogman');
                } else if (currentFilter === 'stitch') {
                    matchesCategory = titleLower.includes('stitch');
                } else if (currentFilter === 'expensive') {
                    matchesCategory = parseFloat(item.price) > 40;
                }

                return matchesSearch && matchesCategory;
            });

            if (filteredProducts.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; font-size: 16px;">No matching items found!</p>';
                return;
            }

            container.innerHTML = filteredProducts.map(item => {
                const isDefault = String(item.id).startsWith('def_');
                return `
                    <div class="card">
                        <div>
                            <div class="card-bar">
                                <span class="ribbon">${isDefault ? 'Classic' : 'User'}</span>
                                ${!isDefault ? `<button class="delete-btn" onclick="deleteItem('${item.id}')">Delete Item</button>` : ''}
                            </div>
                            <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                            <div style="font-weight: bold; font-size: 14px; margin-bottom: 4px;">${item.title}</div>
                        </div>
                        <div>
                            <div class="price">$${Number(item.price).toFixed(2)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addItem() {
            const title = document.getElementById('title').value.trim();
            const price = document.getElementById('price').value;
            const fileInput = document.getElementById('imageFile');

            if (!title || !price) {
                alert('Please fill in the title and price!');
                return;
            }

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveProductFinal(title, price, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                let image = document.getElementById('image').value.trim();
                if (!image) image = 'https://via.placeholder.com/200?text=No+Image';
                saveProductFinal(title, price, image);
            }
        }

        function saveProductFinal(title, price, image) {
            const newProduct = {
                id: 'usr_' + Date.now(),
                title: title,
                price: parseFloat(price),
                image: image
            };

            productsList.unshift(newProduct);
            saveLocalStorge();

            document.getElementById('title').value = '';
            document.getElementById('price').value = '';
            document.getElementById('image').value = '';
            document.getElementById('imageFile').value = '';

            displayProducts();
        }

        function deleteItem(id) {
            productsList = productsList.filter(item => String(item.id) !== String(id));
            saveLocalStorge();
            displayProducts();
        }

        window.onload = function() {
            displayProducts();
        };
    </script>
</body>
</html>
