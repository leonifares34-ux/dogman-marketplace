<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dog Man Marketplace</title>
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #ffcc00; /* Dog Man Yellow */
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0088cc; /* Hero Blue */
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 5px solid black;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 20px auto;
      max-width: 1100px;
      padding: 0 10px;
    }
    .seller-section, .checkout-section {
      background-color: #ffffff;
      border: 4px solid black;
      box-shadow: 5px 5px 0px black;
      flex: 1;
      min-width: 300px;
      max-width: 480px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-sizing: border-box;
    }
    .checkout-section {
      background-color: #0088cc;
      color: white;
    }
    .seller-section input, .checkout-section input, .checkout-section select {
      width: 90%;
      padding: 10px;
      margin: 6px 0;
      border: 3px solid black;
      border-radius: 6px;
      font-weight: bold;
      font-family: inherit;
      box-sizing: border-box;
    }
    .seller-btn {
      background-color: #28a745;
      color: white;
      font-size: 1em;
      border: 3px solid black;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
      margin-top: 10px;
      font-weight: bold;
    }
    .seller-btn:hover { background-color: #218838; }
    .order-btn {
      background-color: #ff3333;
      color: white;
      font-size: 1em;
      border: 3px solid black;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
      margin-top: 10px;
      font-weight: bold;
    }
    .order-btn:hover { background-color: #cc0000; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border: 4px solid black;
      border-radius: 12px;
      padding: 15px;
      width: 220px;
      text-align: center;
      box-shadow: 5px 5px 0px black;
    }
    .card img {
      max-width: 120px;
      height: 120px;
      object-fit: contain;
    }
    .price {
      color: #ff3333;
      font-size: 1.3em;
      margin: 10px 0;
    }
    .buy-btn {
      background-color: #0088cc;
      color: white;
      border: 2px solid black;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .delete-btn {
      background-color: #ff3333;
      color: white;
      border: 2px solid black;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .delete-btn:hover { background-color: #cc0000; }
  </style>

  <!-- SUPABASE LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <h1>🐶 DOG MAN MARKETPLACE 🚨</h1>
  </header>

  <div class="container">
    <!-- 1. SELLER SECTION -->
    <div class="seller-section">
      <h2>⚡ Sell Supa Merch ⚡</h2>
      <input type="text" id="title" placeholder="Item Name (e.g., Supa Buddy Pin)" required><br>
      <input type="number" id="price" placeholder="Price ($)" step="0.01" required><br>
      <input type="url" id="image" placeholder="Image URL (http://...)" required><br>
      <button class="seller-btn" onclick="addItem()">List Item to Supabase!</button>
    </div>

    <!-- 2. CHECKOUT SECTION -->
    <div class="checkout-section">
      <h2>📦 Order & Choose Address 📦</h2>
      <input type="text" id="cust-name" placeholder="Your Name" required><br>
      <input type="text" id="cust-item" placeholder="Item Name Buying" required><br>
      
      <select id="cust-address" required>
        <option value="" disabled selected>-- Select Delivery Address --</option>
        <option value="Bomboklat street">Bomboklat street</option>
        <option value="Factory street">Factory street</option>
        <option value="Oral B Street">Oral B Street</option>
      </select><br>

      <button class="order-btn" onclick="sendOrder()">Submit Order!</button>
    </div>
  </div>

  <!-- PRODUCTS GRID -->
  <div id="product-container" class="grid">Loading items from Supabase database...</div>

  <script>
    // YOUR LIVE SUPABASE CREDENTIALS
    const SUPABASE_URL = "https://vretpcrozplkpqjzaudn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XbD6xgyJNAr-ia39HrKORA_S-9crrjD";

    // Initialize Client
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // FETCH items from Supabase database
    async function fetchProducts() {
      const container = document.getElementById('product-container');
      const { data: products, error } = await supabase
        .from('products')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        container.innerHTML = `<p>Error loading items: ${error.message}</p>`;
        return;
      }

      if (!products || products.length === 0) {
        container.innerHTML = '<p>No items in database yet. Add one above!</p>';
        return;
      }

      container.innerHTML = products.map(item => {
        const safeTitle = item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `
          <div class="card">
            <img src="${item.image}" alt="${safeTitle}">
            <h4>${item.title.length > 25 ? item.title.substring(0, 25) + '...' : item.title}</h4>
            <div class="price">$${item.price}</div>
            <button class="buy-btn" onclick="quickBuy('${safeTitle}')">Buy Item</button><br>
            <button class="delete-btn" onclick="deleteItem(${item.id})">Delete Item</button>
          </div>
        `;
      }).join('');
    }

    // ADD a new item into Supabase database
    async function addItem() {
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const image = document.getElementById('image').value;

      if (!title || !price || !image) {
        alert('Please fill in all seller fields!');
        return;
      }

      const { error } = await supabase
        .from('products')
        .insert([{ title, price, image }]);

      if (error) {
        alert('Error adding item: ' + error.message);
      } else {
        document.getElementById('title').value = '';
        document.getElementById('price').value = '';
        document.getElementById('image').value = '';
        fetchProducts();
      }
    }

    // DELETE item from Supabase by ID
    async function deleteItem(id) {
      const { error } = await supabase
        .from('products')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Error deleting item: ' + error.message);
      } else {
        fetchProducts();
      }
    }

    // Quick-fill checkout form
    function quickBuy(itemTitle) {
      document.getElementById('cust-item').value = itemTitle;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Submit Order via Formspree
    function sendOrder() {
      const customer = document.getElementById('cust-name').value;
      const item = document.getElementById('cust-item').value;
      const address = document.getElementById('cust-address').value;

      if (!customer || !item || !address) {
        alert('Please fill in your name, item, and select an address!');
        return;
      }

      // REPLACE WITH YOUR ACTUAL FORMSPREE FORM ID WHEN READY:
      const targetUrl = "https://formspree.io/f/YOUR_FORM_ID_HERE";

      if (targetUrl.includes("YOUR_FORM_ID_HERE")) {
        alert(`Order Placed (Demo Mode)!\n\nCustomer: ${customer}\nItem: ${item}\nAddress: ${address}\n\n(To receive real emails, replace YOUR_FORM_ID_HERE with your Formspree link!)`);
      } else {
        fetch(targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ "Customer Name": customer, "Item Ordered": item, "Delivery Address": address })
        })
        .then(res => {
          if (res.ok) {
            alert('Order Sent Successfully!');
            document.getElementById('cust-name').value = '';
            document.getElementById('cust-item').value = '';
            document.getElementById('cust-address').selectedIndex = 0;
          } else {
            alert('Error sending order. Check Formspree URL.');
          }
        });
      }
    }

    // Load products on initial open
    fetchProducts();
  </script>

</body>
</html>
