<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Man Marketplace</title>
    <!-- Pusher JS for Live Synced Audio -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        :root {
            --bg-color: #ffcc00;
            --card-bg: #ffffff;
            --text-color: #000000;
            --element-border: #000000;
            --card-bg-hover: #f0f0f0;
            --box-shadow: 4px 4px 0px #000000;
            --small-shadow: 2px 2px 0px #000000;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --element-border: #ffffff;
            --card-bg-hover: #2c2c2c;
            --box-shadow: 4px 4px 0px rgba(255, 255, 255, 0.4);
            --small-shadow: 2px 2px 0px rgba(255, 255, 255, 0.4);
        }

        body {
            font-family: 'Arial Black', Impact, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background-color: var(--header-bg);
            color: #ff0000;
            padding: 20px;
            text-align: center;
            border: 4px solid var(--element-border);
            position: relative;
            box-shadow: var(--box-shadow);
            transition: border-color 0.3s, background-color 0.3s;
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
            color: #ff0000;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--element-border);
            padding: 8px 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--small-shadow);
            font-family: inherit;
            border-radius: 8px;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px auto;
            max-width: 1400px;
            padding: 10px;
        }

        .seller-section, .checkout-section {
            background: var(--card-bg);
            border: 4px solid var(--element-border);
            border-radius: 12px;
            box-shadow: var(--box-shadow);
            padding: 20px;
            flex: 1;
            min-width: 320px;
            max-width: 480px;
            box-sizing: border-box;
            text-align: center;
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .seller-section input, .checkout-section input, .checkout-section select, audio-select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 2px solid var(--element-border);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .item-checkbox-container {
            max-height: 150px;
            overflow-y: auto;
            border: 2px solid var(--element-border);
            border-radius: 4px;
            padding: 10px;
            text-align: left;
            margin-bottom: 10px;
            background: var(--card-bg);
        }

        .item-checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .item-checkbox-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            transform: scale(1.3);
            cursor: pointer;
        }

        .item-checkbox-row label {
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Scrollable Address Card Grid */
        .address-grid {
            display: flex;
            flex-wrap: nowrap;
            gap: 15px;
            overflow-x: auto;
            margin: 15px auto;
            max-width: 100%;
            padding: 10px;
            scroll-behavior: smooth;
            border: 2px solid var(--element-border);
            border-radius: 8px;
            background: var(--card-bg);
        }

        .address-card {
            background: var(--card-bg);
            border: 2px solid var(--element-border);
            border-radius: 8px;
            padding: 10px;
            min-width: 140px;
            max-width: 140px;
            text-align: center;
            cursor: pointer;
            flex: 0 0 auto;
            transition: transform 0.1s, border-color 0.3s, background-color 0.3s;
            box-sizing: border-box;
        }

        .address-card:hover {
            transform: translateY(-2px);
        }

        .address-card input[type="radio"] {
            display: none;
        }

        .address-card img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 4px;
            border: 2px solid var(--element-border);
        }

        .address-card span {
            font-size: 0.8rem;
            font-weight: bold;
            display: block;
            line-height: 1.1;
        }

        .address-card-selected {
            border: 3px solid #ff0000 !important;
            background-color: #ffe6e6 !important;
            color: #ff0000;
        }

        .seller-btn {
            background: #28a745;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid var(--element-border);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: var(--small-shadow);
        }

        .seller-btn:hover {
            background: #218838;
        }

        .order-btn {
            background: #ff0000;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid var(--element-border);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: var(--small-shadow);
        }

        .order-btn:hover {
            background: #cc0000;
        }

        /* Search & Filter Bar Styles */
        .search-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px auto;
            max-width: 800px;
            padding: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 280px;
            padding: 12px 18px;
            font-size: 1.1rem;
            border: 3px solid var(--element-border);
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--text-color);
            box-shadow: var(--small-shadow);
            font-family: inherit;
        }

        .surprise-btn {
            background: #ff47ab;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            border: 3px solid var(--element-border);
            border-radius: 12px;
            padding: 12px 24px;
            cursor: pointer;
            box-shadow: var(--small-shadow);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .surprise-btn:hover {
            background: #e03d96;
            transform: translateY(-2px);
        }

        .filter-chip-wrapper {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            max-width: 1000px;
            margin: 0 auto 20px auto;
            padding: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-chip {
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--element-border);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--small-shadow);
            font-family: inherit;
            transition: transform 0.1s, background-color 0.3s;
        }

        .filter-chip:hover {
            transform: translateY(-2px);
        }

        .filter-chip.active {
            background: #ff0000;
            color: #ffffff;
            border-color: var(--element-border);
        }

        /* Grid */
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 3px solid var(--element-border);
            border-radius: 12px;
            width: 200px;
            padding: 15px;
            box-shadow: var(--box-shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, background-color 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border: 2px solid var(--element-border);
            border-radius: 8px;
            margin-bottom: 10px;
            background: #fff;
        }

        .card-bar {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .ribbon {
            background: #ffe600;
            color: #000000;
            padding: 2px 6px;
            font-size: 0.75rem;
            font-weight: bold;
            border: 2px solid var(--element-border);
            border-radius: 4px;
        }

        .delete-btn {
            background: #ff4747;
            color: #ffffff;
            border: 2px solid var(--element-border);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #e03b3b;
        }

        .price {
            font-size: 1.1rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 10px;
        }

        .buy-btn {
            background: #ff0000;
            color: #ffffff;
            width: 100%;
            padding: 8px;
            font-weight: bold;
            border: 2px solid var(--element-border);
            border-radius: 6px;
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #cc0000;
        }

        .total-box {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <header>
        <button class="theme-toggle" onclick="toggleDarkMode()">🌙 Night Mode</button>
        <h1>🐶 DOG MAN MARKETPLACE 🐱</h1>
    </header>

    <!-- LIVE SYNCED AUDIO PLAYER -->
    <div style="background: var(--card-bg); border: 4px solid var(--element-border); border-radius: 12px; padding: 15px; max-width: 600px; margin: 20px auto; text-align: center; box-shadow: var(--box-shadow);">
        <h3 style="margin-top: 0;">🎵 Live Synced Announcement 🎵</h3>
        <select id="audio-select" onchange="changeTrackBroadcast()" style="width: 100%; padding: 10px; border: 2px solid var(--element-border); border-radius: 8px; font-size: 1rem; margin-bottom: 10px;">
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">ontrap as sleep</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Beautiful Things</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">Water Breathing</option>
        </select>
        <button id="audio-play-btn" onclick="toggleAudio()" style="background: #28a745; color: #ffffff; border: 2px solid var(--element-border); padding: 12px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%;">
            ▶️ Play for Everyone
        </button>
        <p id="audio-status" style="margin-top: 8px; font-size: 0.85rem; font-weight: bold;">Connected! Tap Play to sync.</p>
    </div>

    <div class="container">
        <!-- SELLER SECTION -->
        <div class="seller-section">
            <h2>🛒 Sell Supa Merch</h2>
            <label style="font-size: 0.9rem; font-weight: bold; display: block; text-align: left;">Item Name (e.g., Supa Buddy Pin)</label>
            <input type="text" id="title-val" placeholder="Item Name (e.g., Supa Buddy Pin)" required>

            <label style="font-size: 0.9rem; font-weight: bold; display: block; text-align: left;">Price ($)</label>
            <input type="number" id="price-val" placeholder="Price ($)" step="0.01" required>

            <label style="font-size: 0.9rem; font-weight: bold; display: block; text-align: left;">Paste Image URL (https://...)</label>
            <input type="text" id="image-val" placeholder="Paste Image URL (https://...)">

            <div style="font-weight: bold; margin: 10px 0;">— OR —</div>

            <label style="font-size: 0.9rem; font-weight: bold; display: block; text-align: left;">Upload Image File:</label>
            <input type="file" id="file-val" accept="image/*">

            <button class="seller-btn" onclick="addItem()">List Item!</button>
        </div>

        <!-- ORDER SECTION -->
        <div class="checkout-section">
            <h2>📦 Order & Choose Address</h2>
            <select id="customer-name" style="width: 100%; padding: 10px; margin: 10px 0;">
                <option value="">- Select Your Name -</option>
                <option value="Arthur">Arthur</option>
                <option value="Denise">Denise</option>
            </select>

            <div style="font-size: 0.9rem; font-weight: bold; text-align: left; margin-top: 10px;">Select Items to Order:</div>
            <div class="item-checkbox-container" id="item-checkbox-container">
                <!-- Checkboxes populated via JS -->
            </div>

            <div class="total-box">Total Amount: $<span id="total-val">0.00</span></div>

            <label style="font-size: 0.9rem; font-weight: bold; display: block; text-align: left; margin-top: 10px;">Select Delivery Address:</label>
            <div class="address-grid">
                <label class="address-card" onclick="selectAddress(this)">
                    <input type="radio" name="cost-address" value="Dogbull Street 1">
                    <img src="https://via.placeholder.com/100?text=DogBull1" alt="Dogbull Street 1">
                    <span>Dogbull Street 1</span>
                </label>
                <label class="address-card" onclick="selectAddress(this)">
                    <input type="radio" name="cost-address" value="Dogbull Street 2">
                    <img src="https://via.placeholder.com/100?text=DogBull2" alt="Dogbull Street 2">
                    <span>Dogbull Street 2</span>
                </label>
                <label class="address-card" onclick="selectAddress(this)">
                    <input type="radio" name="cost-address" value="Factory Street">
                    <img src="https://via.placeholder.com/100?text=Factory" alt="Factory Street">
                    <span>Factory Street</span>
                </label>
            </div>

            <button class="order-btn" onclick="sendOrder()">Submit Order!</button>
        </div>
    </div>

    <!-- SEARCH & FILTER BAR -->
    <div class="search-container">
        <input type="text" class="search-input" id="search-input" placeholder="Search items (e.g., Dog Man, Squishy, Purse)..." oninput="displayProducts()">
        <button class="surprise-btn" onclick="surpriseMe()">🎁 Surprise Me!</button>
    </div>

    <div class="filter-chip-wrapper">
        <button class="filter-chip active" onclick="setCategory('all', this)">All Items</button>
        <button class="filter-chip" onclick="setCategory('Dog Man', this)">Dog Man</button>
        <button class="filter-chip" onclick="setCategory('Squishies', this)">Squishies</button>
        <button class="filter-chip" onclick="setCategory('Purse', this)">Purse</button>
        <button class="filter-chip" onclick="setCategory('Federmappen', this)">Federmappen</button>
        <button class="filter-chip" onclick="setCategory('Bookmarks', this)">Bookmarks</button>
        <button class="filter-chip" onclick="setCategory('Fidgets', this)">Fidgets</button>
        <button class="filter-chip" onclick="setCategory('Algerian', this)">Algerian</button>
        <button class="filter-chip" onclick="setCategory('Expensive', this)">Expensive</button>
    </div>

    <!-- PRODUCT CATALOG GRID -->
    <div id="product-container" class="grid"></div>

    <script>
        const defaultProducts = [
            { id: 'def_01', title: 'Algerian Flag Lausezettel', price: 0.00, image: 'https://via.placeholder.com/200?text=AlgerianFlag' },
            { id: 'def_02', title: 'Dog Man 12', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan12' },
            { id: 'def_03', title: 'Dog Man 11', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan11' },
            { id: 'def_04', title: 'Dog Man 10', price: 11.00, image: 'https://via.placeholder.com/200?text=DogMan10' },
        ];

        let productList = [...defaultProducts];
        let currentFilter = 'all';

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('dogman_products');
            if (saved) {
                try {
                    productList = JSON.parse(saved);
                } catch(e) {
                    productList = [...defaultProducts];
                }
            }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('dogman_products', JSON.stringify(productList));
            } catch(e) {
                console.error("Storage error:", e);
            }
        }

        function setCategory(cat, element) {
            currentFilter = cat;
            document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            displayProducts();
        }

        function selectAddress(labelElement) {
            document.querySelectorAll('.address-card').forEach(card => card.classList.remove('address-card-selected'));
            labelElement.classList.add('address-card-selected');
            const radio = labelElement.querySelector('input[type="radio"]');
            if(radio) radio.checked = true;
        }

        function toggleDarkMode() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            const btn = document.querySelector('.theme-toggle');
            if(body.classList.contains('dark-mode')) {
                btn.innerHTML = "☀️ Light Mode";
            } else {
                btn.innerHTML = "🌙 Night Mode";
            }
        }

        function surpriseMe() {
            if (productList.length === 0) return;
            const randIndex = Math.floor(Math.random() * productList.length);
            const randomItem = productList[randIndex];
            document.getElementById('search-input').value = randomItem.title;
            displayProducts();
        }

        // Pusher Live Audio Sync
        const PUSHER_KEY = 'your_pusher_key_here';
        let pusher = null;
        let channel = null;
        const audioElement = new Audio();

        try {
            pusher = new Pusher(PUSHER_KEY, { cluster: 'eu' });
            channel = pusher.subscribe('audio-sync');

            channel.bind('client-audio-control', function(data) {
                audioElement.src = data.track;
                if (data.action === 'play') {
                    audioElement.currentTime = data.time;
                    audioElement.play().catch(() => {});
                    document.getElementById('audio-status').innerText = "Playing for Everyone";
                } else if (data.action === 'pause') {
                    audioElement.pause();
                    document.getElementById('audio-status').innerText = "Paused remotely";
                }
            });
        } catch(e) {
            console.error("Pusher init error:", e);
        }

        function changeTrackBroadcast() {
            const audioSelect = document.getElementById('audio-select');
            audioElement.src = audioSelect.value;
            if(channel) {
                channel.trigger('client-audio-control', {
                    action: 'track_changed',
                    time: 0,
                    track: audioSelect.value
                });
            }
        }

        function toggleAudio() {
            if (audioElement.paused) {
                audioElement.play();
                document.getElementById('audio-play-btn').innerText = "⏸️ Pause for Everyone";
                document.getElementById('audio-status').innerText = "Broadcasting Play...";
                if(channel) {
                    channel.trigger('client-audio-control', {
                        action: 'play',
                        time: audioElement.currentTime,
                        track: audioElement.src
                    });
                }
            } else {
                audioElement.pause();
                document.getElementById('audio-play-btn').innerText = "▶️ Play for Everyone";
                document.getElementById('audio-status').innerText = "Broadcasting Pause...";
                if(channel) {
                    channel.trigger('client-audio-control', {
                        action: 'pause',
                        time: audioElement.currentTime,
                        track: audioElement.src
                    });
                }
            }
        }

        function deleteItem(id) {
            productList = productList.filter(item => item.id !== id);
            saveToLocalStorage();
            displayProducts();
            updateCheckboxes();
        }

        function updateCheckboxes() {
            const container = document.getElementById('item-checkbox-container');
            container.innerHTML = productList.map(item => `
                <div class="item-checkbox-row">
                    <input type="checkbox" value="${item.id}" onchange="updateTotal()">
                    <label>${item.title} ($${Number(item.price).toFixed(2)})</label>
                </div>
            `).join('');
            updateTotal();
        }

        function updateTotal() {
            const checkedBoxes = document.querySelectorAll('#item-checkbox-container input[type="checkbox"]:checked');
            let total = 0;
            checkedBoxes.forEach(box => {
                const foundProduct = productList.find(p => p.id === box.value);
                if (foundProduct) total += parseFloat(foundProduct.price) || 0;
            });
            document.getElementById('total-val').innerText = total.toFixed(2);
        }

        function displayProducts() {
            const container = document.getElementById('product-container');
            if(!container) return;

            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const filteredProducts = productList.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchQuery);
                let matchesCategory = true;
                if(currentFilter === 'Expensive') {
                    matchesCategory = parseFloat(item.price) >= 40;
                } else if(currentFilter !== 'all') {
                    matchesCategory = item.title.toLowerCase().includes(currentFilter.toLowerCase());
                }
                return matchesSearch && matchesCategory;
            });

            container.innerHTML = filteredProducts.map(item => `
                <div class="card">
                    <div class="card-bar">
                        <span class="ribbon">Supa</span>
                        <button class="delete-btn" onclick="deleteItem('${item.id}')">Delete</button>
                    </div>
                    <img src="${item.image || 'https://via.placeholder.com/200'}" alt="${item.title}">
                    <div style="font-weight: bold; text-align: center; margin-bottom: 5px;">${item.title}</div>
                    <div class="price">$${Number(item.price).toFixed(2)}</div>
                    <button class="buy-btn">Buy Item</button>
                </div>
            `).join('');
        }

        function addItem() {
            const title = document.getElementById('title-val').value.trim();
            const price = document.getElementById('price-val').value;
            const imageUrl = document.getElementById('image-val').value.trim();
            const fileInput = document.getElementById('file-val');

            if (!title || !price) {
                alert("Please fill in the Item name and price!");
                return;
            }

            function saveProductFinal(finalImg) {
                productList.push({
                    id: 'item_' + Date.now(),
                    title: title,
                    price: parseFloat(price),
                    image: finalImg
                });
                saveToLocalStorage();
                document.getElementById('title-val').value = '';
                document.getElementById('price-val').value = '';
                document.getElementById('image-val').value = '';
                document.getElementById('file-val').value = '';
                displayProducts();
                updateCheckboxes();
            }

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveProductFinal(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveProductFinal(imageUrl || 'https://via.placeholder.com/200');
            }
        }

        function sendOrder() {
            const customerName = document.getElementById('customer-name').value;
            const checkedBoxes = document.querySelectorAll('#item-checkbox-container input[type="checkbox"]:checked');
            const selectedAddressElement = document.querySelector('input[name="cost-address"]:checked');
            const address = selectedAddressElement ? selectedAddressElement.value : '';

            if (!customerName || checkedBoxes.length === 0 || !address) {
                alert("Please select a name, at least one item, and an address!");
                return;
            }

            let selectedItems = [];
            let totalPrice = 0;

            checkedBoxes.forEach(box => {
                const found = productList.find(p => p.id === box.value);
                if (found) {
                    selectedItems.push(found.title);
                    totalPrice += parseFloat(found.price);
                }
            });

            // Reset Form on Success
            document.getElementById('customer-name').value = "";
            document.querySelectorAll('#item-checkbox-container input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('.address-card').forEach(card => card.classList.remove('address-card-selected'));
            document.querySelectorAll('input[name="cost-address"]').forEach(r => r.checked = false);
            updateTotal();
            displayProducts();
        }

        window.onload = function() {
            loadFromLocalStorage();
            displayProducts();
            updateCheckboxes();
        };
    </script>
</body>
</html>
