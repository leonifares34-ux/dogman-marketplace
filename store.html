<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dog Man Marketplace</title>
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #ffcc00;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0088cc;
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 5px solid black;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 20px auto;
      max-width: 1100px;
      padding: 0 10px;
    }
    .seller-section, .checkout-section {
      background-color: #ffffff;
      border: 4px solid black;
      box-shadow: 5px 5px 0px black;
      flex: 1;
      min-width: 300px;
      max-width: 480px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-sizing: border-box;
    }
    .checkout-section {
      background-color: #0088cc;
      color: white;
    }
    .seller-section input, .checkout-section input, .checkout-section select {
      width: 90%;
      padding: 10px;
      margin: 6px 0;
      border: 3px solid black;
      border-radius: 6px;
      font-weight: bold;
      font-family: inherit;
      box-sizing: border-box;
    }
    .item-checkbox-container {
      background: white;
      color: black;
      border: 3px solid black;
      border-radius: 6px;
      padding: 10px;
      max-height: 150px;
      overflow-y: auto;
      text-align: left;
      margin: 8px auto;
      width: 90%;
      box-sizing: border-box;
    }
    .item-checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .item-checkbox-row input[type="checkbox"] {
      width: auto;
      margin: 0;
      transform: scale(1.3);
      cursor: pointer;
    }
    .item-checkbox-row label {
      font-weight: bold;
      font-size: 0.9em;
      cursor: pointer;
    }
    .seller-btn {
      background-color: #28a745;
      color: white;
      font-size: 1em;
      border: 3px solid black;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
      margin-top: 10px;
      font-weight: bold;
    }
    .seller-btn:hover { background-color: #218838; }
    .order-btn {
      background-color: #ff3333;
      color: white;
      font-size: 1em;
      border: 3px solid black;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
      margin-top: 10px;
      font-weight: bold;
    }
    .order-btn:hover { background-color: #cc0000; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border: 4px solid black;
      border-radius: 12px;
      padding: 15px;
      width: 220px;
      text-align: center;
      box-shadow: 5px 5px 0px black;
    }
    .card img {
      max-width: 120px;
      height: 120px;
      object-fit: contain;
    }
    .price {
      color: #ff3333;
      font-size: 1.3em;
      margin: 10px 0;
    }
    .buy-btn {
      background-color: #0088cc;
      color: white;
      border: 2px solid black;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .delete-btn {
      background-color: #ff3333;
      color: white;
      border: 2px solid black;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .delete-btn:hover { background-color: #cc0000; }
  </style>
</head>
<body>

  <header>
    <h1>🐶 DOG MAN MARKETPLACE 🚨</h1>
  </header>

  <div class="container">
    <!-- SELLER SECTION -->
    <div class="seller-section">
      <h2>⚡ Sell Supa Merch ⚡</h2>
      <input type="text" id="title" placeholder="Item Name (e.g., Supa Buddy Pin)" required><br>
      <input type="number" id="price" placeholder="Price ($)" step="0.01" required><br>
      
      <!-- OPTION 1: Image Link -->
      <input type="text" id="image-url" placeholder="Paste Image URL (https://...)"><br>
      
      <div style="font-weight: bold; margin: 4px 0;">— OR —</div>
      
      <!-- OPTION 2: File Upload -->
      <label style="font-size: 0.85em; font-weight: bold; display: block;">Upload Image File:</label>
      <input type="file" id="image-file" accept="image/*"><br>
      
      <button class="seller-btn" onclick="addItem()">List Item!</button>
    </div>

    <!-- ORDER SECTION -->
    <div class="checkout-section">
      <h2>📦 Order & Choose Address 📦</h2>
      
      <select id="cust-name" required>
        <option value="" disabled selected>-- Select Your Name --</option>
        <option value="Arthur">Arthur</option>
        <option value="Denise">Denise</option>
        <option value="Josh">Josh</option>
        <option value="Luna">Luna</option>
      </select><br>

      <div style="font-weight: bold; margin-top: 5px;">Select Items to Order:</div>
      <div id="item-checkboxes" class="item-checkbox-container">
        <p style="margin: 0; color: gray;">No items listed yet.</p>
      </div>

      <select id="cust-address" required>
        <option value="" disabled selected>-- Select Delivery Address --</option>
        <option value="Bomboklat street">Bomboklat street</option>
        <option value="Factory street">Factory street</option>
        <option value="Oral B Street">Oral B Street</option>
      </select><br>

      <button class="order-btn" onclick="sendOrder()">Submit Order!</button>
    </div>
  </div>

  <div id="product-container" class="grid"></div>

  <script>
    function getProducts() {
      try {
        const data = localStorage.getItem('dogman_products');
        return data ? JSON.parse(data) : [];
      } catch (e) {
        localStorage.removeItem('dogman_products');
        return [];
      }
    }

    function saveProducts(products) {
      try {
        localStorage.setItem('dogman_products', JSON.stringify(products));
      } catch (e) {
        alert("Image file size is too big! Please paste an Image Link (https://) instead.");
      }
    }

    function updateItemCheckboxes(products) {
      const container = document.getElementById('item-checkboxes');
      if (!container) return;

      if (!products || products.length === 0) {
        container.innerHTML = '<p style="margin: 0; color: gray;">No items available.</p>';
        return;
      }

      container.innerHTML = products.map((item, index) => `
        <div class="item-checkbox-row">
          <input type="checkbox" id="item-check-${index}" value="${item.title}">
          <label for="item-check-${index}">${item.title} ($${item.price})</label>
        </div>
      `).join('');
    }

    function displayProducts() {
      const container = document.getElementById('product-container');
      if (!container) return;

      const products = getProducts();
      updateItemCheckboxes(products);

      if (!products || products.length === 0) {
        container.innerHTML = '<p style="color: black;">No items listed yet. Add one above!</p>';
        return;
      }

      container.innerHTML = products.map(item => {
        const safeTitle = (item.title || 'Item').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        const imgSrc = item.image || 'https://via.placeholder.com/120?text=No+Image';
        return `
          <div class="card">
            <img src="${imgSrc}" alt="${safeTitle}" onerror="this.src='https://via.placeholder.com/120?text=Invalid+Image'">
            <h4>${safeTitle.length > 25 ? safeTitle.substring(0, 25) + '...' : safeTitle}</h4>
            <div class="price">$${item.price}</div>
            <button class="buy-btn" onclick="quickBuy('${safeTitle}')">Buy Item</button><br>
            <button class="delete-btn" onclick="deleteItem(${item.id})">Delete Item</button>
          </div>
        `;
      }).join('');
    }

    function addItem() {
      const title = document.getElementById('title').value.trim();
      const price = document.getElementById('price').value.trim();
      let imageUrl = document.getElementById('image-url').value.trim();
      const fileInput = document.getElementById('image-file');

      if (!title || !price) {
        alert('Please fill in the item name and price!');
        return;
      }

      if (!imageUrl && fileInput.files.length === 0) {
        alert('Please either paste an Image URL OR upload an Image File!');
        return;
      }

      function saveProduct(finalImage) {
        const products = getProducts();
        products.unshift({
          id: Date.now(),
          title: title,
          price: price,
          image: finalImage
        });

        saveProducts(products);

        document.getElementById('title').value = '';
        document.getElementById('price').value = '';
        document.getElementById('image-url').value = '';
        fileInput.value = '';

        displayProducts();
      }

      if (fileInput.files.length > 0) {
        const reader = new FileReader();
        reader.onload = function(e) {
          saveProduct(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        if (!imageUrl.startsWith('http://') && !imageUrl.startsWith('https://')) {
          imageUrl = 'https://' + imageUrl;
        }
        saveProduct(imageUrl);
      }
    }

    function deleteItem(id) {
      let products = getProducts();
      products = products.filter(item => item.id !== id);
      saveProducts(products);
      displayProducts();
    }

    function quickBuy(itemTitle) {
      const checkboxes = document.querySelectorAll('#item-checkboxes input[type="checkbox"]');
      checkboxes.forEach(cb => {
        if (cb.value === itemTitle) {
          cb.checked = true;
        }
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function sendOrder() {
      const customer = document.getElementById('cust-name').value;
      const address = document.getElementById('cust-address').value;

      const selectedBoxes = document.querySelectorAll('#item-checkboxes input[type="checkbox"]:checked');
      const selectedItems = Array.from(selectedBoxes).map(cb => cb.value);

      if (!customer || selectedItems.length === 0 || !address) {
        alert('Please select a name, at least ONE item, and an address!');
        return;
      }

      const FORMSPREE_URL = "https://formspree.io/f/maewbvzr";

      fetch(FORMSPREE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          "Customer Name": customer,
          "Items Ordered": selectedItems.join(', '),
          "Total Items": selectedItems.length,
          "Delivery Address": address
        })
      })
      .then(res => {
        if (res.ok) {
          alert(`Order sent successfully! (${selectedItems.length} items ordered)`);
          document.getElementById('cust-name').selectedIndex = 0;
          document.getElementById('cust-address').selectedIndex = 0;
          document.querySelectorAll('#item-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = false);
        } else {
          alert('Failed to send order. Check your Formspree URL.');
        }
      })
      .catch(err => alert('Network error: ' + err.message));
    }

    window.onload = function() {
      displayProducts();
    };
  </script>

</body>
</html>
