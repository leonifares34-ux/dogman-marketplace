<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dog Man Marketplace</title>
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #ffcc00;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0088cc;
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 5px solid black;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 20px auto;
      max-width: 1100px;
      padding: 0 10px;
    }
    .seller-section, .checkout-section {
      background-color: #ffffff;
      border: 4px solid black;
      box-shadow: 5px 5px 0px black;
      flex: 1;
      min-width: 300px;
      max-width: 480px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-sizing: border-box;
    }
    .checkout-section {
      background-color: #0088cc;
      color: white;
    }
    .seller-section input, .checkout-section input, .checkout-section select {
      width: 90%;
      padding: 10px;
      margin: 6px 0;
      border: 3px solid black;
      border-radius: 6px;
      font-weight: bold;
      font-family: inherit;
      box-sizing: border-box;
    }
    .seller-btn {
      background-color: #28a745;
      color: white;
      font-size: 1em;
      border: 3px solid black;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
      margin-top: 10px;
      font-weight: bold;
    }
    .seller-btn:hover { background-color: #218838; }
    .order-btn {
      background-color: #ff3333;
      color: white;
      font-size: 1em;
      border: 3px solid black;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
      margin-top: 10px;
      font-weight: bold;
    }
    .order-btn:hover { background-color: #cc0000; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border: 4px solid black;
      border-radius: 12px;
      padding: 15px;
      width: 220px;
      text-align: center;
      box-shadow: 5px 5px 0px black;
    }
    .card img {
      max-width: 120px;
      height: 120px;
      object-fit: contain;
    }
    .price {
      color: #ff3333;
      font-size: 1.3em;
      margin: 10px 0;
    }
    .buy-btn {
      background-color: #0088cc;
      color: white;
      border: 2px solid black;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .delete-btn {
      background-color: #ff3333;
      color: white;
      border: 2px solid black;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .delete-btn:hover { background-color: #cc0000; }
  </style>
</head>
<body>

  <header>
    <h1>🐶 DOG MAN MARKETPLACE 🚨</h1>
  </header>

  <div class="container">
    <!-- SELLER SECTION -->
    <div class="seller-section">
      <h2>⚡ Sell Supa Merch ⚡</h2>
      <input type="text" id="title" placeholder="Item Name (e.g., Supa Buddy Pin)" required><br>
      <input type="number" id="price" placeholder="Price ($)" step="0.01" required><br>
      <input type="url" id="image" placeholder="Image URL (http://...)" required><br>
      <button class="seller-btn" onclick="addItem()">List Item!</button>
    </div>

    <!-- ORDER SECTION -->
    <div class="checkout-section">
      <h2>📦 Order & Choose Address 📦</h2>
      
      <!-- CUSTOMER NAME INPUT -->
      <input type="text" id="cust-name" placeholder="Your Name" required><br>

      <!-- ITEM SELECTION DROP-DOWN -->
      <select id="cust-item" required>
        <option value="" disabled selected>-- Select Item to Order --</option>
      </select><br>
      
      <!-- ADDRESS DROP-DOWN -->
      <select id="cust-address" required>
        <option value="" disabled selected>-- Select Delivery Address --</option>
        <option value="Bomboklat street">Bomboklat street</option>
        <option value="Factory street">Factory street</option>
        <option value="Oral B Street">Oral B Street</option>
      </select><br>

      <button class="order-btn" onclick="sendOrder()">Submit Order!</button>
    </div>
  </div>

  <!-- PRODUCTS GRID -->
  <div id="product-container" class="grid"></div>

  <script>
    function getProducts() {
      const data = localStorage.getItem('dogman_products');
      return data ? JSON.parse(data) : [];
    }

    function saveProducts(products) {
      localStorage.setItem('dogman_products', JSON.stringify(products));
    }

    function updateItemDropdown(products) {
      const itemSelect = document.getElementById('cust-item');
      if (products.length === 0) {
        itemSelect.innerHTML = '<option value="" disabled selected>-- No Items Available --</option>';
        return;
      }

      let options = '<option value="" disabled selected>-- Select Item to Order --</option>';
      products.forEach(item => {
        options += `<option value="${item.title}">${item.title} ($${item.price})</option>`;
      });
      itemSelect.innerHTML = options;
    }

    function displayProducts() {
      const container = document.getElementById('product-container');
      const products = getProducts();

      // Update the Order Tab dropdown menu automatically
      updateItemDropdown(products);

      if (products.length === 0) {
        container.innerHTML = '<p style="color: black;">No items listed yet. Add one above!</p>';
        return;
      }

      container.innerHTML = products.map(item => {
        const safeTitle = item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `
          <div class="card">
            <img src="${item.image}" alt="${safeTitle}">
            <h4>${safeTitle.length > 25 ? safeTitle.substring(0, 25) + '...' : safeTitle}</h4>
            <div class="price">$${item.price}</div>
            <button class="buy-btn" onclick="quickBuy('${safeTitle}')">Buy Item</button><br>
            <button class="delete-btn" onclick="deleteItem(${item.id})">Delete Item</button>
          </div>
        `;
      }).join('');
    }

    function addItem() {
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const image = document.getElementById('image').value;

      if (!title || !price || !image) {
        alert('Please fill in all seller fields!');
        return;
      }

      const products = getProducts();
      products.unshift({
        id: Date.now(),
        title: title,
        price: price,
        image: image
      });

      saveProducts(products);

      document.getElementById('title').value = '';
      document.getElementById('price').value = '';
      document.getElementById('image').value = '';

      displayProducts();
    }

    function deleteItem(id) {
      let products = getProducts();
      products = products.filter(item => item.id !== id);
      saveProducts(products);
      displayProducts();
    }

    function quickBuy(itemTitle) {
      const itemSelect = document.getElementById('cust-item');
      itemSelect.value = itemTitle;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function sendOrder() {
      const customer = document.getElementById('cust-name').value;
      const item = document.getElementById('cust-item').value;
      const address = document.getElementById('cust-address').value;

      if (!customer || !item || !address) {
        alert('Please fill in your name, select an item, and select an address!');
        return;
      }

      // 🔴 PASTE YOUR FORMSPREE LINK HERE:
      const FORMSPREE_URL = "https://formspree.io/f/maewbvzr";

      if (FORMSPREE_URL.includes("maewbvzr")) {
        alert(`Order Placed!\n\nCustomer Name: ${customer}\nItem Ordered: ${item}\nDelivery Address: ${address}\n\n(To receive real emails, paste your Formspree link into line 192!)`);
      } else {
        fetch(FORMSPREE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            "Customer Name": customer,
            "Item Ordered": item,
            "Delivery Address": address
          })
        })
        .then(res => {
          if (res.ok) {
            alert('Order sent successfully!');
            document.getElementById('cust-name').value = '';
            document.getElementById('cust-item').selectedIndex = 0;
            document.getElementById('cust-address').selectedIndex = 0;
          } else {
            alert('Failed to send order. Check your Formspree URL.');
          }
        })
        .catch(err => alert('Network error: ' + err.message));
      }
    }

    displayProducts();
  </script>

</body>
</html>
