<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Man Marketplace</title>
  <!-- Pusher Script -->
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #333333;
      --header-bg: #1e1e1e;
      --header-text: #ffffff;
      --element-border: #cccccc;
      --shadow: rgba(0, 0, 0, 0.1);
      --small-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
    }

    body.dark_mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --header-bg: #2d2d2d;
      --header-text: #ffffff;
      --element-border: #444444;
      --shadow: rgba(0, 0, 0, 0.5);
      --small-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      background-color: var(--header-bg);
      color: var(--header-text);
      padding: 20px;
      text-align: center;
      position: relative;
      border-bottom: 2px solid var(--element-border);
      transition: border-color 0.3s, background-color 0.3s;
    }

    body.dark_mode header {
      border-color: #444;
    }

    .theme-toggle-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--element-border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      font-family: inherit;
      box-shadow: var(--small-shadow);
      transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .theme-toggle-btn:hover {
      box-shadow: 0 4px 12px var(--shadow);
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .seller-section, .checkout-section {
      background-color: var(--card-bg);
      border: 2px solid var(--element-border);
      border-radius: 12px;
      box-shadow: 4px 4px 0px var(--shadow), 0px 0px 0px 1px var(--element-border);
      padding: 20px;
      box-sizing: border-box;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    body.dark_mode .seller-section,
    body.dark_mode .checkout-section {
      border-color: #444;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
    }

    .seller-section input-checkbox, .checkout-section select, .audio-select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 2px solid var(--element-border);
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      background-color: var(--card-bg);
      color: var(--text-color);
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    .item-checkbox-container {
      display: flex;
      flex-direction: column;
      max-height: 150px;
      overflow-y: auto;
      border: 2px solid var(--element-border);
      border-radius: 4px;
      padding: 8px;
      margin: 10px 0;
      text-align: left;
      background-color: var(--bg-color);
      transition: all 0.3s;
    }

    .item-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .item-checkbox-row input[type="checkbox"] {
      width: auto;
      margin: 0;
      transform: scale(1.3);
      cursor: pointer;
    }

    .item-checkbox-row label {
      font-size: 14px;
      font-weight: normal;
      cursor: pointer;
    }

    /* Scrollable Address Card Grid */
    .address-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-height: 230px;
      overflow-y: auto;
      margin: 10px auto;
      padding: 4px;
      width: 100%;
      box-sizing: border-box;
      justify-content: center;
      border: 2px solid var(--element-border);
      border-radius: 8px;
      background-color: var(--bg-color);
      transition: border-color 0.3s, background-color 0.3s;
    }

    body.dark_mode .address-grid {
      border-color: #444;
      background-color: #181818;
    }

    .address-card {
      background: var(--card-bg);
      border: 2px solid var(--element-border);
      border-radius: 8px;
      padding: 8px;
      width: 100px;
      min-height: 100px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: var(--small-shadow);
      transition: transform 0.1s, border-color 0.3s, background-color 0.3s;
      box-sizing: border-box;
      position: relative;
    }

    .address-card:hover {
      transform: translateY(-2px);
    }

    .address-card input[type="radio"] {
      display: none;
    }

    .address-card img {
      width: 100%;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 4px;
      border: 1px solid var(--element-border);
    }

    .address-card span {
      font-size: 10px;
      font-weight: bold;
      line-height: 1.1em;
      color: var(--text-color);
      word-break: break-word;
    }

    .address-card-selected {
      border-color: #ffcc00 !important;
      background-color: #fff9e6 !important;
      color: #000000;
    }

    body.dark_mode .address-card-selected {
      background-color: #332b00 !important;
      color: #ffffff;
    }

    .seller-btn {
      background: #4bb543;
      color: #ffffff;
      border: 2px solid var(--element-border);
      padding: 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
      box-shadow: var(--small-shadow);
      transition: transform 0.1s;
    }

    .seller-btn:hover {
      background: #3e9e38;
      transform: scale(1.01);
    }

    .order-btn {
      background: #ffcc00;
      color: #000000;
      border: 2px solid var(--element-border);
      padding: 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
      box-shadow: var(--small-shadow);
      transition: transform 0.1s;
    }

    .order-btn:hover {
      background: #e6b800;
      transform: scale(1.01);
    }

    body.dark_mode .order-btn {
      background: #d4a017;
      color: #ffffff;
    }

    /* Search & Filter Bar Styles */
    .filter-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      margin: 20px auto;
      max-width: 600px;
      width: 100%;
      padding: 0 10px;
      box-sizing: border-box;
    }

    .search-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .search-input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid var(--element-border);
      border-radius: 8px;
      background-color: var(--card-bg);
      color: var(--text-color);
      outline: none;
      box-shadow: var(--small-shadow);
      font-family: inherit;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    .surprise-btn {
      background: #ff47ab;
      color: #ffffff;
      border: 2px solid var(--element-border);
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      box-shadow: var(--small-shadow);
      transition: transform 0.1s, background-color 0.3s;
      white-space: nowrap;
    }

    .surprise-btn:hover {
      background: #e03d99;
      transform: scale(1.02);
    }

    body.dark_mode .surprise-btn {
      background: #c71585;
    }

    .filter-chips-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      width: 100%;
    }

    .filter-chip {
      background: var(--card-bg);
      border: 2px solid var(--element-border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: var(--text-color);
      box-shadow: var(--small-shadow);
      transition: transform 0.1s, background-color 0.3s, color 0.3s, border-color 0.3s;
      font-family: inherit;
    }

    .filter-chip:hover {
      transform: translateY(-2px);
    }

    .filter-chip-active {
      background-color: #ffcc00 !important;
      color: #000000 !important;
      border-color: #cc9900 !important;
    }

    body.dark_mode .filter-chip-active {
      background-color: #d4a017 !important;
      color: #ffffff !important;
      border-color: #aa7a00 !important;
    }

    /* Card Grid Styles */
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--element-border);
      border-radius: 12px;
      width: 220px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 4px 4px 0px var(--shadow), 0px 0px 0px 1px var(--element-border);
      overflow: hidden;
      transition: transform 0.2s, background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
    }

    .card-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 10px;
    }

    .ribbon {
      background: #ff47ab;
      color: #ffffff;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid var(--element-border);
    }

    .ribbon.dog { background-color: #ff5722; color: #ffffff; }
    .ribbon.cat { background-color: #4caf50; color: #ffffff; }
    .ribbon.misc { background-color: #9c27b0; color: #ffffff; }

    body.dark_mode .ribbon.dog { background-color: #d84315; }
    body.dark_mode .ribbon.cat { background-color: #388e3c; }
    body.dark_mode .ribbon.misc { background-color: #7b1fa2; }

    .delete-btn {
      background: transparent;
      border: 2px solid var(--element-border);
      border-radius: 4px;
      color: #ff3333;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      font-weight: bold;
      transition: transform 0.1s, background-color 0.3s;
      box-shadow: var(--small-shadow);
    }

    .delete-btn:hover {
      background-color: rgba(255, 0, 0, 0.1);
      transform: scale(1.1);
    }

    .card h3 {
      font-size: 14px;
      margin: 0 10px 8px 10px;
      flex-grow: 1;
      color: var(--text-color);
    }

    .price {
      background: #ffcc00;
      color: #000000;
      border: 2px solid var(--element-border);
      padding: 6px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      margin: 10px;
      border-radius: 6px;
      box-shadow: var(--small-shadow);
    }

    body.dark_mode .price {
      background: #d4a017;
      color: #ffffff;
    }

    .buy-btn {
      background: var(--text-color);
      color: var(--card-bg);
      border: 2px solid var(--element-border);
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border-radius: 0 0 10px 10px;
      transition: background-color 0.3s, color 0.3s;
    }

    .buy-btn:hover {
      opacity: 0.9;
    }

    .total-box {
      font-weight: bold;
      margin: 10px 0;
      font-size: 16px;
      color: var(--text-color);
    }
  </style>
</head>
<body class="page-body">

  <button class="theme-toggle-btn" onclick="toggleDarkMode()">☀️ Light Mode</button>

  <header>
    <h1>DOG MAN MARKETPLACE</h1>
  </header>

  <div class="container">

    <!-- LIVE AUDIO PLAYER WIDGET -->
    <div style="background-color: var(--card-bg); border: 2px solid var(--element-border); border-radius: 12px; padding: 15px; border-radius: 12px; text-align: center; width: 100%; max-width: 480px; margin: 20px auto; box-shadow: 4px 4px 0px var(--shadow);">
      <div style="margin-bottom: 10px; font-weight: bold;">🔊 Live Synced Announcement 📢</div>
      
      <select id="audio-select" onchange="changeTrackBroadcasted()" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 2px solid var(--element-border); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); font-family: inherit;">
        <option value="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf7ee.mp3?filename=lofi-study-112191.mp3">LoFi - Lofi Study</option>
        <option value="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c7a73167.mp3?filename=beautiful-things-105874.mp3">MP3 - Beautiful Things</option>
        <option value="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a1378873.mp3?filename=water-breathing-579463.mp3">MP3 - Water Breathing</option>
      </select>

      <audio id="audio-player" src="" preload="auto" ended="handleTrackEnded()"></audio>
      
      <button id="audio-play-btn" onclick="toggleAudio()" style="background-color: #ffcc00; color: #000000; border: 2px solid var(--element-border); padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; box-shadow: var(--small-shadow);">
        Play for Everyone
      </button>
      
      <div id="status-text" style="margin-top: 8px; font-size: 0.85em; font-weight: bold; margin-top: 10px; color: #666;">
        Connecting to sync network...
      </div>
    </div>

    <!-- SELLER SECTION -->
    <div class="seller-section">
      <h3>🏷️ Sell Dog Man Product 🐾</h3>
      <input type="text" id="title" placeholder="Product Title (e.g., Lupa Buddy Peg)" required><br>
      <input type="number" id="price" placeholder="Price (e.g., 9.99)" step="0.01" required><br>
      
      <label style="font-size: 12px; font-weight: bold; display: block; upload image file">Image URL:</label>
      <input type="text" id="imageURL" placeholder="Paste image URL (https://...)"><br>
      
      <div style="font-size: 12px; font-weight: bold; display: block; upload image file">-- OR --</div>
      <input type="file" id="imageFile" accept="image/*" style="display: block; upload image file"><br>

      <select id="seller-btn" style="margin-top: 10px; width: 100%;">
        <option value="dog">Dog</option>
        <option value="cat">Cat</option>
        <option value="misc">Misc</option>
      </select>
      
      <button class="seller-btn" onclick="addItem()">List Item</button>
    </div>

    <!-- ORDER SECTION -->
    <div class="checkout-section">
      <h3>🛒 Order & Choose Address <span id="cart-badge" style="background: #ff3333; color: #ffffff; border: 2px solid var(--element-border); padding: 2px 6px; border-radius: 12px; font-size: 12px;">0</span></h3>
      
      <select id="select-item" onchange="updateTotal()" style="display: none;">
        <option value="" disabled selected>Select Your Item</option>
      </select>

      <div style="font-size: 14px; font-weight: bold; margin-top: 5px; text-align: left;">Select Items to Order:</div>
      <div class="item-checkbox-container" id="item-checkboxes">
        <span style="font-size: 12px; color: #888; margin: auto;">No items listed yet. :(</span>
      </div>

      <div class="total-box">Total Amount: <span id="total-span">$0.00</span></div>

      <div style="font-size: 14px; font-weight: bold; margin-top: 5px; text-align: left;">Select Delivery Address:</div>
      
      <!-- Scrollable Address Card Grid -->
      <div class="address-grid" id="address-grid">
        <label class="address-card" onclick="selectAddress(this)">
          <input type="radio" name="card-address" value="Dogbuluk Street 1">
          <img src="https://via.placeholder.com/100?text=Dogbuluk1" alt="Dogbuluk Street 1">
          <span>Dogbuluk Street 1</span>
        </label>
        <label class="address-card" onclick="selectAddress(this)">
          <input type="radio" name="card-address" value="Dogbuluk Street 2">
          <img src="https://via.placeholder.com/100?text=Dogbuluk2" alt="Dogbuluk Street 2">
          <span>Dogbuluk Street 2</span>
        </label>
        <label class="address-card" onclick="selectAddress(this)">
          <input type="radio" name="card-address" value="Factory Street">
          <img src="https://via.placeholder.com/100?text=Factory" alt="Factory">
          <span>Factory Street</span>
        </label>
        <label class="address-card" onclick="selectAddress(this)">
          <input type="radio" name="card-address" value="Tralal Street">
          <img src="https://via.placeholder.com/100?text=Tralal" alt="Tralal">
          <span>Tralal Street</span>
        </label>
        <label class="address-card" onclick="selectAddress(this)">
          <input type="radio" name="card-address" value="Flower Street">
          <img src="https://via.placeholder.com/100?text=Flower" alt="Flower">
          <span>Flower Street</span>
        </label>
        <label class="address-card" onclick="selectAddress(this)">
          <input type="radio" name="card-address" value="Garden Street">
          <img src="https://via.placeholder.com/100?text=Garden" alt="Garden">
          <span>Garden Street</span>
        </label>
        <label class="address-card" onclick="selectAddress(this)">
          <input type="radio" name="card-address" value="Garage Street">
          <img src="https://via.placeholder.com/100?text=Garage" alt="Garage">
          <span>Garage Street</span>
        </label>
        <label class="address-card" onclick="selectAddress(this)">
          <input type="radio" name="card-address" value="Trampoline Street">
          <img src="https://via.placeholder.com/100?text=Trampoline" alt="Trampoline">
          <span>Trampoline Street</span>
        </label>
      </div>

      <button class="order-btn" onclick="sendOrder()">Submit Order</button>
    </div>

  </div>

  <!-- SEARCH & FILTER BAR SECTION -->
  <div class="filter-container">
    <div class="search-row">
      <input type="text" id="search-input" class="search-input" placeholder="Search items (e.g., Dog Man, Squishy, Purse)..." oninput="displayProducts()">
      <button class="surprise-btn" onclick="surpriseMe()">Surprise Me! 🎁</button>
    </div>
    
    <div class="filter-chips-wrapper">
      <button class="filter-chip filter-chip-active" onclick="setCategory('all', this)">All Items</button>
      <button class="filter-chip" onclick="setCategory('dog', this)">🐕 Dog</button>
      <button class="filter-chip" onclick="setCategory('cat', this)">🐈 Cat</button>
      <button class="filter-chip" onclick="setCategory('misc', this)">🪄 Misc</button>
      <button class="filter-chip" onclick="setCategory('expensive', this)">💎 Expensive</button>
    </div>
  </div>

  <div id="product-container" class="grid"></div>

      { id: 'def_23', title: 'Dog Man 6', price: 11.00, image: 'https://via.placeholder.com/100?text=DogMan6' },
      { id: 'def_24', title: 'Dog Man 7', price: 11.00, image: 'https://via.placeholder.com/100?text=DogMan7' },
      { id: 'def_25', title: 'Dog Man 8', price: 11.00, image: 'https://via.placeholder.com/100?text=DogMan8' },
      { id: 'def_26', title: 'Dog Man 9', price: 11.00, image: 'https://via.placeholder.com/100?text=DogMan9' },
      { id: 'def_27', title: 'Dog Man 10', price: 11.00, image: 'https://via.placeholder.com/100?text=DogMan10' },
      { id: 'def_28', title: 'Dog Man 11', price: 11.00, image: 'https://via.placeholder.com/100?text=DogMan11' },
      { id: 'def_29', title: 'Dog Man 12', price: 11.00, image: 'https://via.placeholder.com/100?text=DogMan12' }
    ];

    let productList = loadFromLocalStorage() || [...defaultProducts];

    function loadFromLocalStorage() {
      try {
        const saved = localStorage.getItem('dogman_products');
        return saved ? JSON.parse(saved) : null;
      } catch (e) {
        console.error("Error loading from localStorage", e);
        return [...defaultProducts];
      }
    }

    function saveLocalstorage() {
      try {
        localStorage.setItem('dogman_products', JSON.stringify(productList));
      } catch (e) {
        console.error("Error saving to localStorage", e);
      }
    }

    function setCategory(category, btn) {
      currentFilter = category;
      document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
      btn.classList.add('active');
      displayProducts();
    }

    function selectAddress(card) {
      document.querySelectorAll('.address-card').forEach(c => c.classList.remove('address-card-selected'));
      card.classList.add('address-card-selected');
      const radio = card.querySelector('input[type="radio"]');
      if (radio) radio.checked = true;
    }

    function toggleDarkMode() {
      const body = document.body;
      body.classList.toggle('dark_mode');
      const isDark = body.classList.contains('dark_mode');
      const btn = document.querySelector('.theme-toggle-btn');
      btn.textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
      localStorage.setItem('darkMode', isDark);
    }

    function surpriseMe() {
      if (productList.length === 0) return;
      const randomIdx = Math.floor(Math.random() * productList.length);
      document.getElementById('search-input').value = productList[randomIdx].title;
      displayProducts();
    }

    // // 1. PUSHER LIVE SYNC SETUP (WEBS)
    const PUSHER_KEY = "9b3c3b3131cf431e7743";
    const PUSHER_CLUSTER = "eu";

    let pusher, channel;
    try {
      pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
      channel = pusher.subscribe('audio-sync-room');
    } catch (e) {
      console.error("Pusher init error:", e);
    }

    const audio = document.getElementById('audio-player');
    const audioSelect = document.getElementById('audio-select');
    const playBtn = document.getElementById('audio-play-btn');
    const statusText = document.getElementById('status-text');

    if (pusher && channel) {
      channel.bind('client-audio-control', function(data) {
        audioSrc = data.track;
        if (audio.src !== audioSrc) {
          audio.src = audioSrc;
        }
        audio.currentTime = data.time;

        if (data.action === 'play') {
          audio.play().catch(() => {});
          playBtn.textContent = 'Pause for Everyone';
          statusText.textContent = 'Playing in sync';
        } else if (data.action === 'pause') {
          audio.pause();
          playBtn.textContent = 'Play for Everyone';
          statusText.textContent = 'Paused remotely';
        }
      });
    }

    function changeTrackBroadcasted() {
      audio.src = audioSelect.value;
      audio.currentTime = 0;
      audio.play().then(() => {
        playBtn.textContent = 'Pause for Everyone';
        statusText.textContent = 'Track changed. Ready to sync.';
        if (channel) {
          channel.trigger('client-audio-control', {
            action: 'play',
            time: 0,
            track: audioSelect.value
          });
        }
      }).catch(() => {
        statusText.textContent = 'Tap anywhere on screen to allow sound!';
      });
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.textContent = 'Pause for Everyone';
          statusText.textContent = 'Broadcasting Play...';
          if (channel) {
            channel.trigger('client-audio-control', {
              action: 'play',
              time: audio.currentTime,
              track: audio.src
            });
          }
        }).catch(() => {
          statusText.textContent = 'Tap anywhere on screen to allow sound!';
        });
      } else {
        audio.pause();
        playBtn.textContent = 'Play for Everyone';
        statusText.textContent = 'Broadcasting Pause...';
        if (channel) {
          channel.trigger('client-audio-control', {
            action: 'pause',
            time: audio.currentTime,
            track: audio.src
          });
        }
      }
    }

    function handleTrackEnded() {
      let currentIndex = audioSelect.selectedIndex;
      let nextIndex = (currentIndex + 1) % audioSelect.options.length;
      audioSelect.selectedIndex = nextIndex;
      audio.src = audioSelect.value;
      audio.currentTime = 0;
      audio.play().then(() => {
        playBtn.textContent = 'Pause for Everyone';
        statusText.textContent = 'Playing next track';
        if (channel) {
          channel.trigger('client-audio-control', {
            action: 'play',
            time: 0,
            track: audio.src
          });
        }
      }).catch(() => {
        statusText.textContent = 'Tap anywhere on screen to allow sound!';
      });
    }

    // // 2. PRODUCT & LOCALSTORAGE LOGIC
    function deleteItem(itemId) {
      productList = productList.filter(item => item.id !== String(itemId));
      saveLocalstorage();
      displayProducts();
    }

    function updateTotalPrice() {
      const selectedBoxes = document.querySelectorAll('#item-checkboxes input[type="checkbox"]:checked');
      let total = 0;

      selectedBoxes.forEach(box => {
        const foundProduct = productList.find(p => p.id === String(box.value));
        if (foundProduct) total += parseFloat(foundProduct.price) || 0;
      });

      const totalDisplay = document.getElementById('total-span');
      totalDisplay.textContent = `$${total.toFixed(2)}`;

      const badge = document.getElementById('cart-badge');
      badge.textContent = selectedBoxes.length;
    }

    function updateItemCheckboxes() {
      const container = document.getElementById('item-checkboxes');
      if (!container) return;

      if (productList.length === 0) {
        container.innerHTML = `<span style="font-size: 12px; color: #888; margin: auto;">No items available. :(</span>`;
        return;
      }

      const checkedIds = Array.from(document.querySelectorAll('#item-checkboxes input[type="checkbox"]:checked'))
        .map(cb => cb.value);

      container.innerHTML = productList.map(item => {
        const isChecked = checkedIds.includes(String(item.id)) ? 'checked' : '';
        return `
          <div class="item-checkbox-row">
            <input type="checkbox" id="chk-${item.id}" value="${item.id}" ${isChecked} onchange="updateTotalPrice()">
            <label for="chk-${item.id}">${item.title} ($${parseFloat(item.price).toFixed(2)})</label>
          </div>
        `;
      }).join('');

      updateTotalPrice();
    }

    function displayProducts() {
      const container = document.getElementById('product-container');
      if (!container) return;

      updateItemCheckboxes();

      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      const filteredProducts = productList.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(searchQuery);

        let matchesCategory = true;
        if (currentFilter === 'expensive') {
          matchesCategory = parseFloat(item.price) >= 40;
        } else if (currentFilter !== 'all') {
          matchesCategory = item.id.toLowerCase().includes(currentFilter);
        }

        return matchesSearch && matchesCategory;
      });

      if (filteredProducts.length === 0) {
        container.innerHTML = `<p style="text-align: center; font-size: 16px; width: 100%;">No matching items found :(</p>`;
        return;
      }

      container.innerHTML = filteredProducts.map(item => {
        const isDog = item.title.toLowerCase().includes('dog') || item.id.toLowerCase().includes('dog');
        const isCat = item.title.toLowerCase().includes('cat') || item.id.toLowerCase().includes('cat');
        const ribbonClass = isDog ? 'dog' : (isCat ? 'cat' : 'misc');
        const ribbonText = isDog ? '🐕 Dog' : (isCat ? '🐈 Cat' : '🪄 Misc');

        return `
          <div class="card">
            <div class="card-bar">
              <span class="ribbon ${ribbonClass}">${ribbonText}</span>
              <button class="delete-btn" onclick="deleteItem('${item.id}')">Delete Item 🗑️</button>
            </div>
            <img src="${item.image || 'https://via.placeholder.com/100?text=NoImage'}" alt="${item.title}">
            <h3>${item.title}</h3>
            <div class="price">$${parseFloat(item.price).toFixed(2)}</div>
            <div class="buy-btn" onclick="quickBuy('${item.id}')">Quick Buy ⚡</div>
          </div>
        `;
      }).join('');
    }

    function addItem() {
      const title = document.getElementById('title').value.trim();
      const price = document.getElementById('price').value.trim();
      const imageURL = document.getElementById('imageURL').value.trim();
      const fileInput = document.getElementById('imageFile');
      const categoryType = document.getElementById('seller-btn').value;

      if (!title || !price) {
        alert('Please fill in the title and price!');
        return;
      }

      if (fileInput.files.length > 0) {
        const reader = new FileReader();
        reader.onload = function(e) {
          saveProductFinal({
            id: 'custom_' + Date.now(),
            title: title,
            price: price,
            image: e.target.result
          });
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        saveProductFinal({
          id: categoryType + '_' + Date.now(),
          title: title,
          price: price,
          image: imageURL || 'https://via.placeholder.com/100?text=Custom'
        });
      }
    }

    function saveProductFinal(newProduct) {
      productList.unshift(newProduct);
      saveLocalstorage();

      document.getElementById('title').value = '';
      document.getElementById('price').value = '';
      document.getElementById('imageURL').value = '';
      document.getElementById('imageFile').value = '';

      displayProducts();
    }

    function quickBuy(itemId) {
      const chk = document.getElementById(`chk-${itemId}`);
      if (chk) {
        chk.checked = true;
        updateTotalPrice();
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    }

    function sendOrder() {
      const customerName = document.getElementById('title').value; // placeholder context
      const selectedBoxes = document.querySelectorAll('#item-checkboxes input[type="checkbox"]:checked');
      const selectedAddress = document.querySelector('input[name="card-address"]:checked');

      if (selectedBoxes.length === 0) {
        alert('Please select at least one item to order!');
        return;
      }

      if (!selectedAddress) {
        alert('Please select a delivery address!');
        return;
      }

      const selectedItems = [];
      let totalPrice = 0;

      selectedBoxes.forEach(box => {
        const foundProduct = productList.find(p => p.id === String(box.value));
        if (foundProduct) {
          selectedItems.push(foundProduct.title);
          totalPrice += parseFloat(foundProduct.price) || 0;
        }
      });

      const FORMAT_TOTAL = `$${totalPrice.toFixed(2)}`;
      const PUSHER_URL = "https://formspree.io/f/mnevzark";

      fetch(PUSHER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          "email": "lupafoeri@gmail.com",
          "customer_name": "Dog Man Marketplace Customer",
          "items_ordered": selectedItems.join(', '),
          "total_price": FORMAT_TOTAL,
          "selected_items_length": selectedBoxes.length,
          "DELIVERY_ADDRESS": selectedAddress.value
        })
      }).then(res => {
        if (res.ok) {
          alert(`Order sent successfully! (Selected items: ${selectedBoxes.length} items ordered for ${FORMAT_TOTAL})`);
          
          document.getElementById('select-item').selectedIndex = 0;
          document.querySelectorAll('#item-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = false);
          document.querySelectorAll('input[name="card-address"]').forEach(cb => cb.checked = false);
          document.querySelectorAll('.address-card').forEach(c => c.classList.remove('address-card-selected'));
          
          updateTotalPrice();
        } else {
          res.json().then(data => {
            console.error("Formspree response error:", data);
            alert("Error! Check form configuration or monthly limit.");
          });
        }
      }).catch(err => {
        console.error("Network error:", err);
        alert("Network error! 'err.message'");
      });
    }

    window.onload = function() {
      displayProducts();
      const savedDark = localStorage.getItem('darkMode') === 'true';
      if (savedDark) {
        document.body.classList.add('dark_mode');
        document.querySelector('.theme-toggle-btn').textContent = '🌙 Dark Mode';
      }
    };
  </script>
</body>
</html>
