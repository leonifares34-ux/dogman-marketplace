<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Man Marketplace</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    h1 { color: #333; text-align: center; }
    .card { background: white; padding: 20px; margin: 15px auto; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; }
    input, button { margin: 8px 0; padding: 10px; display: block; width: 100%; box-sizing: border-radius: 4px; border: 1px solid #ccc; }
    button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #218838; }
    .password-container { position: relative; }
    .toggle-btn { position: absolute; right: 10px; top: 12px; background: none; border: none; width: auto; color: #555; cursor: pointer; }
    .listing-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    .price { color: #28a745; font-weight: bold; }
    #seller-tools { display: none; background: #e8f4ea; border: 1px solid #28a745; }
  </style>
</head>
<body>

  <h1>🐾 Dog Man Marketplace</h1>

  <!-- LOGIN / ACCOUNT SECTION -->
  <div class="card" id="auth-section">
    <h2>Login / Create Account</h2>
    <input type="text" id="username" placeholder="Username (e.g. DogManOfficial)">
    
    <div class="password-container">
      <input type="password" id="password" placeholder="Password">
      <button type="button" class="toggle-btn" onclick="togglePassword()">👁️</button>
    </div>

    <button onclick="login()">Login</button>
    <p id="user-status" style="font-weight: bold; color: #007bff;"></p>
  </div>

  <!-- SELLER LISTING FORM (Appears for DogManOfficial) -->
  <div class="card" id="seller-tools">
    <h2>➕ Add New Item (Seller Only)</h2>
    <input type="text" id="item-title" placeholder="Item Name (e.g. Supa Buddies Badge)">
    <input type="number" id="item-price" placeholder="Price ($)">
    <button onclick="addListing()">Post Item</button>
  </div>

  <!-- MARKETPLACE LISTINGS -->
  <div class="card">
    <h2>Available Items</h2>
    <div id="listings-list">Loading items...</div>
  </div>

  <!-- PLACE ORDER -->
  <div class="card">
    <h2>Place an Order</h2>
    <input type="text" id="order-listing-id" placeholder="Item ID to buy">
    <input type="text" id="buyer-name" placeholder="Your Name">
    <input type="text" id="fake-address" placeholder="Delivery Address">
    <button onclick="placeOrder()">Submit Order</button>
  </div>

  <script>
    let currentUser = null;

    function togglePassword() {
      const passInput = document.getElementById('password');
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    }

    async function login() {
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value;

      if (!usernameInput || !passwordInput) {
        alert("Please enter both username and password!");
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const data = await res.json();

        if (data.success) {
          currentUser = data.user;
          document.getElementById('user-status').innerText = `Logged in as: ${currentUser.username}`;
          
          // Show Seller form if logged in as DogManOfficial
          if (currentUser.username.toLowerCase() === 'dogmanofficial') {
            document.getElementById('seller-tools').style.display = 'block';
          } else {
            document.getElementById('seller-tools').style.display = 'none';
          }

          alert(`Welcome, ${currentUser.username}!`);
          loadListings();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert("Error logging in!");
      }
    }

    async function addListing() {
      const title = document.getElementById('item-title').value;
      const price = document.getElementById('item-price').value;

      if (!title || !price) {
        alert("Please enter a title and price!");
        return;
      }

      const formData = new FormData();
      formData.append('title', title);
      formData.append('price', price);

      try {
        const res = await fetch('/api/listings', {
          method: 'POST',
          headers: { 'x-username': currentUser.username },
          body: formData
        });

        const data = await res.json();
        if (data.success) {
          alert("Item posted successfully!");
          document.getElementById('item-title').value = '';
          document.getElementById('item-price').value = '';
          loadListings();
        } else {
          alert(data.error || "Failed to add item!");
        }
      } catch (err) {
        alert("Error adding item!");
      }
    }

    async function loadListings() {
      try {
        const res = await fetch('/api/listings');
        const listings = await res.json();
        const container = document.getElementById('listings-list');

        if (listings.length === 0) {
          container.innerHTML = '<p>No items listed yet!</p>';
          return;
        }

        container.innerHTML = listings.map(item => `
          <div class="listing-item">
            <h3>${item.title}</h3>
            <p class="price">$${item.price}</p>
            <p><strong>Seller:</strong> ${item.ownerName}</p>
            <p><small>ID: ${item.id}</small></p>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('listings-list').innerText = "Failed to load listings.";
      }
    }

    async function placeOrder() {
      const listingId = document.getElementById('order-listing-id').value;
      const buyerName = document.getElementById('buyer-name').value;
      const fakeAddress = document.getElementById('fake-address').value;

      if (!buyerName || !fakeAddress) {
        alert("Please fill in your name and address!");
        return;
      }

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ listingId, buyerName, fakeAddress })
        });

        const data = await res.json();
        if (data.success) {
          alert(data.message);
        } else {
          alert(data.error || "Order failed!");
        }
      } catch (err) {
        alert("Error placing order!");
      }
    }

    loadListings();
  </script>

</body>
</html>
