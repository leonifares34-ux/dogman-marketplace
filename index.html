<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dog Man Store - Login</title>
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #ffcc00; /* Dog Man Yellow */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      background-color: #0088cc; /* Dog Man Blue */
      color: white;
      padding: 30px;
      border-radius: 12px;
      border: 4px solid black;
      box-shadow: 6px 6px 0px black;
      text-align: center;
      width: 280px;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 3px solid black;
      border-radius: 6px;
      font-weight: bold;
    }
    button {
      background-color: #ff3333; /* Supa Red */
      color: white;
      font-size: 1.1em;
      font-weight: bold;
      padding: 10px 20px;
      border: 3px solid black;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 3px 3px 0px black;
    }
    button:hover { background-color: #cc0000; }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>🐾 DOG MAN STORE</h1>
    <form action="store.html">
      <input type="text" placeholder="Hero Name" required><br>
      <input type="password" placeholder="Secret Code" required><br><br>
      <button type="submit">LOG IN!</button>
    </form>
  </div>

</body>
</html>
