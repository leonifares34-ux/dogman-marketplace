<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dog Man Marketplace</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; background: #fdf6e3; padding: 10px; }
    .box { background: white; padding: 15px; border-radius: 8px; border: 2px solid #333; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .card { border: 2px solid #000; border-radius: 8px; padding: 10px; background: #fff; text-align: center; }
    .card img { max-width: 100%; height: 140px; object-fit: cover; }
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); }
    .modal-body { background:white; width:280px; margin:100px auto; padding:20px; border-radius:8px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>🐶 Dog Man Marketplace</h1>

  <!-- LOGIN & SIGNUP -->
  <div id="loginBox" class="box">
    <h2>🔑 Log In / Create Account</h2>
    <form id="loginForm">
      <input type="text" id="loginUser" placeholder="Choose a Username" required /><br><br>
      <input type="password" id="loginPass" placeholder="Choose a Password" required /><br><br>
      <button type="submit">Enter Marketplace</button>
    </form>
    <p><small>💡 New usernames automatically register! If taken, enter the correct password.</small></p>
  </div>

  <!-- USER STATUS & CHANGE PASSWORD -->
  <div id="userBar" class="box hidden">
    <h3>Welcome back, <span id="displayUser"></span>! <span id="badge"></span></h3>
    <button onclick="logout()">Logout</button>
    <hr>
    <h4>🔒 Change Password</h4>
    <form id="changePasswordForm">
      <input type="password" id="oldPass" placeholder="Current Password" required />
      <input type="password" id="newPass" placeholder="New Password" required />
      <button type="submit">Update Password</button>
    </form>
  </div>

  <!-- CREATOR UPLOAD (@DogMan Only) -->
  <div id="uploadBox" class="box hidden">
    <h2>⚡ Creator Upload (@DogMan Only)</h2>
    <form id="uploadForm">
      <input type="text" name="title" placeholder="Item Name" required /><br><br>
      <input type="text" name="price" placeholder="Price (e.g. 10 Dog Biscuits)" required /><br><br>
      <input type="file" name="photo" accept="image/*" required /><br><br>
      <button type="submit">Showcase Item!</button>
    </form>
  </div>

  <h2>Available Items</h2>
  <div id="listingsGrid" class="grid"></div>

  <!-- ORDER MODAL -->
  <div id="orderModal" class="modal">
    <div class="modal-body">
      <h3>Fake Order Form</h3>
      <form id="orderForm">
        <input type="hidden" id="modalListingId">
        <input type="text" id="buyerName" placeholder="Your Name" required /><br><br>
        <input type="text" id="fakeAddress" placeholder="Fake Delivery Address" required /><br><br>
        <button type="submit">Place Order 🚀</button>
        <button type="button" onclick="closeModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('loginUser').value,
          password: document.getElementById('loginPass').value
        })
      });

      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        if (data.message) alert(data.message);
        updateUI();
      } else {
        alert(data.error);
      }
    });

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: currentUser.username,
          oldPassword: document.getElementById('oldPass').value,
          newPassword: document.getElementById('newPass').value
        })
      });

      const data = await res.json();
      if (data.success) {
        alert(data.message);
        document.getElementById('oldPass').value = '';
        document.getElementById('newPass').value = '';
      } else {
        alert(data.error);
      }
    });

    function logout() {
      currentUser = null;
      updateUI();
    }

    function updateUI() {
      if (currentUser) {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('userBar').classList.remove('hidden');
        document.getElementById('displayUser').innerText = currentUser.username;

        if (currentUser.isSeller) {
          document.getElementById('badge').innerText = '⭐ (Seller)';
          document.getElementById('uploadBox').classList.remove('hidden');
        } else {
          document.getElementById('badge').innerText = '🛒 (Buyer)';
          document.getElementById('uploadBox').classList.add('hidden');
        }
      } else {
        document.getElementById('loginBox').classList.remove('hidden');
        document.getElementById('userBar').classList.add('hidden');
        document.getElementById('uploadBox').classList.add('hidden');
      }
    }

    async function loadListings() {
      const res = await fetch('/api/listings');
      const items = await res.json();
      document.getElementById('listingsGrid').innerHTML = items.map(item => `
        <div class="card">
          <img src="${item.imageUrl}" alt="${item.title}">
          <h3>${item.title}</h3>
          <p><b>Price:</b> ${item.price}</p>
          <p><small>Seller: ${item.ownerName}</small></p>
          <button onclick="openModal('${item.id}')">📦 Order Now</button>
        </div>
      `).join('');
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/listings', {
        method: 'POST',
        headers: { 'x-username': currentUser ? currentUser.username : '' },
        body: new FormData(e.target)
      });
      const data = await res.json();
      if (data.success) { 
        alert('Item listed by @DogMan!'); 
        e.target.reset(); 
        loadListings(); 
      } else { 
        alert(data.error); 
      }
    });

    function openModal(id) { 
      if (!currentUser) { alert('Please log in first to order!'); return; }
      document.getElementById('modalListingId').value = id; 
      document.getElementById('buyerName').value = currentUser.username;
      document.getElementById('orderModal').style.display = 'block'; 
    }
    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          listingId: document.getElementById('modalListingId').value,
          buyerName: document.getElementById('buyerName').value,
          fakeAddress: document.getElementById('fakeAddress').value
        })
      });
      const data = await res.json();
      alert(data.message);
      closeModal();
    });

    loadListings();
  </script>
</body>
</html>
